name: Veredas 10.6 Stall Fix Probe

on:
  push:
    branches:
      - projeto-jornada-snapshots
  workflow_dispatch:

concurrency:
  group: veredas-106-stall-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild mechanical baseline
        working-directory: projeto_jornada
        run: |
          python tools/rebuild_content.py
          python tools/refine_npc_authenticity.py
          python tools/refine_character_balance.py
          python tools/enforce_character_horizontal_budget.py
          python tools/refine_enemy_balance.py
          python tools/refine_item_economy.py
      - name: Patch simulator-only stall recovery locally
        working-directory: projeto_jornada
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('core/systems/JourneySimulationEngine.gd')
          s = p.read_text(encoding='utf-8')
          old = '''    var rounds := 0\n    while bool(CombatEngine.combat.get("active", false)) and rounds < MAX_COMBAT_ROUNDS:\n        rounds += 1\n        var before_turn := int(CombatEngine.combat.get("turn", 0))\n        var before_enemy_hp := int((CombatEngine.combat.get("enemy", {}) as Dictionary).get("hp", 0))\n        var before_player_hp := int((CombatEngine.combat.get("player", {}) as Dictionary).get("hp", 0))\n        var decision := policy_engine.choose_combat_decision(policy_id, CombatEngine.combat)\n        _apply_combat_decision(decision)\n        if bool(CombatEngine.combat.get("active", false)):\n            var after_turn := int(CombatEngine.combat.get("turn", 0))\n            var after_enemy_hp := int((CombatEngine.combat.get("enemy", {}) as Dictionary).get("hp", 0))\n            var after_player_hp := int((CombatEngine.combat.get("player", {}) as Dictionary).get("hp", 0))\n            if after_turn == before_turn and after_enemy_hp == before_enemy_hp and after_player_hp == before_player_hp:\n                _combat_fallback()\n'''
          new = '''    var rounds := 0\n    var stalled_rounds := 0\n    while bool(CombatEngine.combat.get("active", false)) and rounds < MAX_COMBAT_ROUNDS:\n        rounds += 1\n        var before_turn := int(CombatEngine.combat.get("turn", 0))\n        var before_enemy_hp := int((CombatEngine.combat.get("enemy", {}) as Dictionary).get("hp", 0))\n        var before_player_hp := int((CombatEngine.combat.get("player", {}) as Dictionary).get("hp", 0))\n        var decision := _combat_progress_decision() if stalled_rounds >= 6 else policy_engine.choose_combat_decision(policy_id, CombatEngine.combat)\n        _apply_combat_decision(decision)\n        if bool(CombatEngine.combat.get("active", false)):\n            var after_turn := int(CombatEngine.combat.get("turn", 0))\n            var after_enemy_hp := int((CombatEngine.combat.get("enemy", {}) as Dictionary).get("hp", 0))\n            var after_player_hp := int((CombatEngine.combat.get("player", {}) as Dictionary).get("hp", 0))\n            if after_turn == before_turn and after_enemy_hp == before_enemy_hp and after_player_hp == before_player_hp:\n                _combat_fallback()\n                after_enemy_hp = int((CombatEngine.combat.get("enemy", {}) as Dictionary).get("hp", 0))\n            if after_enemy_hp < before_enemy_hp:\n                stalled_rounds = 0\n            else:\n                stalled_rounds += 1\n'''
          if s.count(old) != 1:
              raise SystemExit('combat loop anchor mismatch')
          s = s.replace(old, new)
          anchor = '''func _combat_fallback() -> void:\n'''
          helper = '''func _combat_progress_decision() -> Dictionary:\n    var player: Dictionary = CombatEngine.combat.get("player", {}) as Dictionary\n    var distance := int(player.get("distance", 1))\n    var movement_locked := StatusEngine.movement_locked(player)\n    var weapon_range := InventoryEngine.weapon_range()\n    if InventoryEngine.equipped_item("weapon").is_empty():\n        weapon_range = Vector2i(0, 0)\n    if distance < weapon_range.x:\n        return {"kind":"action", "id":"guard" if movement_locked else "retreat"}\n    if distance > weapon_range.y:\n        return {"kind":"action", "id":"guard" if movement_locked else "advance"}\n    if int(player.get("vigor", 0)) >= 2:\n        return {"kind":"action", "id":"precise"}\n    return {"kind":"action", "id":"strike"}\n\n'''
          if s.count(anchor) != 1:
              raise SystemExit('fallback helper anchor mismatch')
          s = s.replace(anchor, helper + anchor)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Download Godot
        run: |
          curl -fL 'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7.1' -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path projeto_jornada --editor --quit
      - name: Re-certify 10.2
        run: |
          bash projeto_jornada/tools/run_godot_gate.sh \
            /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            res://tests/character_balance_certification.tscn \
            'CHARACTER_BALANCE_CERTIFICATION FAIL' \
            'CHARACTER_BALANCE_CERTIFICATION PASS: 10.2'
      - name: Re-certify 10.3
        run: |
          bash projeto_jornada/tools/run_godot_gate.sh \
            /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            res://tests/enemy_balance_certification.tscn \
            'ENEMY_BALANCE_CERTIFICATION FAIL' \
            'ENEMY_BALANCE_CERTIFICATION PASS: 10.3'
      - name: Add integrated narrative fixture
        working-directory: projeto_jornada
        run: python tools/refine_narrative_balance.py
      - name: Certify 10.6 candidate
        run: |
          bash projeto_jornada/tools/run_godot_gate.sh \
            /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            res://tests/difficulty_balance_certification.tscn \
            'DIFFICULTY_BALANCE_CERTIFICATION FAIL' \
            'DIFFICULTY_BALANCE_CERTIFICATION PASS: 10.6'
