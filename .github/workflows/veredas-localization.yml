name: Veredas Localization Architecture

on:
  push:
    branches:
      - projeto-jornada-snapshots
    paths:
      - 'projeto_jornada/localization/**'
      - 'projeto_jornada/ui/LocalizationService.gd'
      - 'projeto_jornada/ui/AccessibilityPanel.gd'
      - 'projeto_jornada/tools/localization_inventory.py'
      - 'projeto_jornada/tools/export_localization_catalog.py'
      - 'projeto_jornada/tools/localization_linguistic_report.py'
      - 'projeto_jornada/tools/localization_schema_audit.py'
      - 'projeto_jornada/tools/ui_localization_inventory.py'
      - 'projeto_jornada/tests/LocalizationArchitectureCertification.gd'
      - 'projeto_jornada/tests/localization_architecture_certification.tscn'
      - '.github/workflows/veredas-localization.yml'
  workflow_dispatch:

concurrency:
  group: veredas-localization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  localization-11-5-11-6:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild integrated fixture
        working-directory: projeto_jornada
        run: |
          python tools/rebuild_content.py >/dev/null
          python tools/refine_npc_authenticity.py >/dev/null
          python tools/refine_character_balance.py >/dev/null
          python tools/enforce_character_horizontal_budget.py >/dev/null
          python tools/refine_enemy_balance.py >/dev/null
          python tools/refine_item_economy.py >/dev/null
          python tools/refine_narrative_balance.py >/dev/null
          python tools/validate_canonical.py >/dev/null
      - name: Inventory stable-ID localization surface
        working-directory: projeto_jornada
        run: python tools/localization_inventory.py
      - name: Export contextual source catalog
        working-directory: projeto_jornada
        run: python tools/export_localization_catalog.py --output /tmp/veredas-localization-source.json
      - name: Report linguistic coverage and glossary integrity
        working-directory: projeto_jornada
        run: python tools/localization_linguistic_report.py --output /tmp/veredas-linguistic-report.json
      - name: Require full classification of content string fields
        working-directory: projeto_jornada
        run: python tools/localization_schema_audit.py --require-classified --output /tmp/veredas-localization-schema-audit.json
      - name: Inventory hardcoded UI literals
        working-directory: projeto_jornada
        run: python tools/ui_localization_inventory.py --output /tmp/veredas-ui-localization-inventory.json
      - name: Download Godot
        run: |
          curl -fsSL 'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7.1' -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project headless
        run: |
          set -o pipefail
          output=$(/tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path projeto_jornada --editor --quit 2>&1)
          if printf '%s\n' "$output" | grep -E 'SCRIPT ERROR|Parse Error|Failed to load script'; then printf '%s\n' "$output"; exit 1; fi
      - name: Phase 11 localization architecture certification 11.5
        run: |
          bash projeto_jornada/tools/run_godot_gate.sh \
            /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            res://tests/localization_architecture_certification.tscn \
            'LOCALIZATION_ARCHITECTURE_CERTIFICATION FAIL' \
            'LOCALIZATION_ARCHITECTURE_CERTIFICATION PASS: 11.5'
      - name: Upload linguistic working reports
        uses: actions/upload-artifact@v4
        with:
          name: veredas-localization-working-report
          path: |
            /tmp/veredas-localization-source.json
            /tmp/veredas-linguistic-report.json
            /tmp/veredas-localization-schema-audit.json
            /tmp/veredas-ui-localization-inventory.json
          retention-days: 7
