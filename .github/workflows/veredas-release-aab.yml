name: Veredas Signed Release AAB

on:
  workflow_dispatch:
    inputs:
      qa_11_10_run_id:
        description: 'Successful Veredas QA Freeze 11.10 workflow run ID whose certified runtime/build inputs must match this release'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: veredas-signed-release-aab-${{ github.ref }}
  cancel-in-progress: false

env:
  VEREDAS_ANDROID_PACKAGE_ID: com.pmartins87.veredasdatrama
  GODOT_VERSION: '4.7.1-stable'
  GODOT_LINUX_X86_64_SHA256: 'c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba'
  GODOT_EXPORT_TEMPLATES_SHA256: '86409db6200b6f8fd3230989c2d2002851f3dd18acf11d7bdbafddf5a0dd0f72'
  BUNDLETOOL_VERSION: '1.18.3'
  BUNDLETOOL_SHA256: 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29'

jobs:
  signed-release-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: release
    steps:
      - name: Checkout release evidence head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download certified 11.10 completion and runtime input manifest
        uses: actions/download-artifact@v4
        with:
          name: veredas-qa-11-10-completion
          path: /tmp/veredas-qa-11-10
          github-token: ${{ github.token }}
          run-id: ${{ inputs.qa_11_10_run_id }}

      - name: Bind release to certified 11.10 ancestry and evidence
        run: |
          set -euo pipefail
          python projeto_jornada/tools/release_rc_binding_gate.py \
            --completion /tmp/veredas-qa-11-10/QA_11_10_COMPLETION.json \
            --release-input-manifest /tmp/veredas-qa-11-10/QA_11_10_RELEASE_INPUT_MANIFEST.json \
            --workflow-run-id '${{ inputs.qa_11_10_run_id }}' \
            --release-head '${{ github.sha }}'
          mkdir -p build/android-release
          cp /tmp/veredas-qa-11-10/QA_11_10_COMPLETION.json \
            build/android-release/QA_11_10_COMPLETION.json
          cp /tmp/veredas-qa-11-10/QA_11_10_RELEASE_INPUT_MANIFEST.json \
            build/android-release/QA_11_10_RELEASE_INPUT_MANIFEST.json

      - name: Prove release runtime and build inputs are identical to certified 11.10
        working-directory: projeto_jornada
        run: |
          set -euo pipefail
          python tools/release_input_scope_gate.py
          python tools/release_input_fingerprint.py \
            --compare "$GITHUB_WORKSPACE/build/android-release/QA_11_10_RELEASE_INPUT_MANIFEST.json" \
            --output "$GITHUB_WORKSPACE/build/android-release/release-input-manifest.json"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned Android 36 release SDK
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.1.0"
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.1.0"

      - name: Fail closed unless publication contracts are certified
        working-directory: projeto_jornada
        run: |
          python tools/roadmap_state_consistency.py
          python tools/release_input_scope_gate.py
          python tools/validate_android_export.py
          python tools/release_version_identity_gate.py --release
          python tools/release_signing_identity_gate.py
          python tools/privacy_data_safety_gate.py --release
          python tools/platform_compliance_gate.py --release
          python tools/legal_surface_gate.py --release
          python tools/qa_release_candidate_gate.py
          python tools/validate_canonical.py

      - name: Require protected signing secrets and inspect public upload certificate
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.VEREDAS_ANDROID_KEYSTORE_B64 }}
          KEY_ALIAS: ${{ secrets.VEREDAS_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.VEREDAS_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          install -d -m 700 /tmp/veredas-release
          printf '%s' "$KEYSTORE_B64" | base64 --decode > /tmp/veredas-release/upload.keystore
          chmod 600 /tmp/veredas-release/upload.keystore
          test -s /tmp/veredas-release/upload.keystore
          keytool -list -keystore /tmp/veredas-release/upload.keystore \
            -storepass "$KEY_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          keytool -exportcert \
            -keystore /tmp/veredas-release/upload.keystore \
            -storepass "$KEY_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -file /tmp/veredas-release/upload-cert.der
          python projeto_jornada/tools/release_signing_identity_gate.py \
            --upload-cert /tmp/veredas-release/upload-cert.der

      - name: Install pinned Godot 4.7.1 stable
        run: |
          set -euo pipefail
          curl -fL \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v4.7.1-stable_linux.x86_64.zip" \
            -o /tmp/godot.zip
          printf '%s  %s\n' "$GODOT_LINUX_X86_64_SHA256" /tmp/godot.zip | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --version | grep -q '^4.7.1.stable'

      - name: Install pinned Godot 4.7.1 export templates
        run: |
          set -euo pipefail
          curl -fL \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v4.7.1-stable_export_templates.tpz" \
            -o /tmp/templates.tpz
          printf '%s  %s\n' "$GODOT_EXPORT_TEMPLATES_SHA256" /tmp/templates.tpz | sha256sum -c -
          rm -rf /tmp/godot-templates
          mkdir -p /tmp/godot-templates "$HOME/.local/share/godot/export_templates/4.7.1.stable"
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          if [ -d /tmp/godot-templates/templates ]; then
            cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.1.stable/"
          else
            cp -a /tmp/godot-templates/. "$HOME/.local/share/godot/export_templates/4.7.1.stable/"
          fi
          test -f "$HOME/.local/share/godot/export_templates/4.7.1.stable/android_release.apk"

      - name: Install pinned official bundletool
        run: |
          set -euo pipefail
          curl -fL \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar" \
            -o /tmp/bundletool.jar
          printf '%s  %s\n' "$BUNDLETOOL_SHA256" /tmp/bundletool.jar | sha256sum -c -
          test "$(java -jar /tmp/bundletool.jar version)" = "$BUNDLETOOL_VERSION"

      - name: Configure Android SDK paths
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.config/godot"
          EDITOR_SETTINGS="${HOME}/.config/godot/editor_settings-4.7.tres"
          printf '%s\n' \
            '[gd_resource type="EditorSettings" format=3]' \
            '' \
            '[resource]' \
            "export/android/android_sdk_path = \"${ANDROID_HOME}\"" \
            "export/android/java_sdk_path = \"${JAVA_HOME}\"" \
            > "$EDITOR_SETTINGS"

      - name: Import candidate project
        run: |
          set -o pipefail
          output=$(/tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path projeto_jornada --editor --quit 2>&1)
          printf '%s\n' "$output"
          if printf '%s\n' "$output" | grep -E 'SCRIPT ERROR|Parse Error|Failed to load script'; then
            exit 1
          fi

      - name: Export signed release AAB
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: /tmp/veredas-release/upload.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.VEREDAS_ANDROID_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.VEREDAS_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p build/android-release
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --verbose --path projeto_jornada \
            --export-release 'Android Play AAB (Unsigned CI Template)' \
            "$GITHUB_WORKSPACE/build/android-release/veredas-da-trama.aab" \
            2>&1 | tee build/android-release/export.log
          test -s build/android-release/veredas-da-trama.aab
          if grep -E 'SCRIPT ERROR|Parse Error|Export failed' build/android-release/export.log; then
            exit 1
          fi

      - name: Inspect exact AAB manifest and effective permissions
        run: |
          set -euo pipefail
          python projeto_jornada/tools/release_aab_identity_gate.py \
            --aab build/android-release/veredas-da-trama.aab \
            --bundletool /tmp/bundletool.jar \
            --evidence-output build/android-release/aab-identity-evidence.json

      - name: Verify exact AAB signer identity and fingerprint artifact
        run: |
          set -euo pipefail
          jarsigner -verify -strict -verbose -certs build/android-release/veredas-da-trama.aab \
            > build/android-release/signature-verification.txt
          grep -Eq 'jar verified|verified' build/android-release/signature-verification.txt
          keytool -printcert -rfc -jarfile build/android-release/veredas-da-trama.aab \
            > /tmp/veredas-release/aab-signer.pem
          python projeto_jornada/tools/release_signing_identity_gate.py \
            --release \
            --upload-cert /tmp/veredas-release/aab-signer.pem \
            --evidence-output build/android-release/signing-identity-evidence.json
          printf '%s\n' "application_id=$VEREDAS_ANDROID_PACKAGE_ID" > build/android-release/release-metadata.txt
          printf '%s\n' "release_git_sha=$GITHUB_SHA" >> build/android-release/release-metadata.txt
          printf '%s\n' "qa_11_10_run_id=${{ inputs.qa_11_10_run_id }}" >> build/android-release/release-metadata.txt
          printf '%s\n' "target_sdk=36" >> build/android-release/release-metadata.txt
          printf '%s\n' "compile_sdk=36" >> build/android-release/release-metadata.txt
          printf '%s\n' "android_build_tools=36.1.0" >> build/android-release/release-metadata.txt
          printf '%s\n' "godot_version=$GODOT_VERSION" >> build/android-release/release-metadata.txt
          printf '%s\n' "godot_linux_x86_64_sha256=$GODOT_LINUX_X86_64_SHA256" >> build/android-release/release-metadata.txt
          printf '%s\n' "godot_export_templates_sha256=$GODOT_EXPORT_TEMPLATES_SHA256" >> build/android-release/release-metadata.txt
          printf '%s\n' "bundletool_version=$BUNDLETOOL_VERSION" >> build/android-release/release-metadata.txt
          printf '%s\n' "bundletool_sha256=$BUNDLETOOL_SHA256" >> build/android-release/release-metadata.txt
          sha256sum build/android-release/QA_11_10_COMPLETION.json \
            | tee build/android-release/QA_11_10_COMPLETION.json.sha256
          sha256sum build/android-release/QA_11_10_RELEASE_INPUT_MANIFEST.json \
            | tee build/android-release/QA_11_10_RELEASE_INPUT_MANIFEST.json.sha256
          sha256sum build/android-release/veredas-da-trama.aab \
            | tee build/android-release/veredas-da-trama.aab.sha256

      - name: Verify certified inputs still match after import and export
        working-directory: projeto_jornada
        run: |
          set -euo pipefail
          python tools/release_input_scope_gate.py
          python tools/release_input_fingerprint.py \
            --compare "$GITHUB_WORKSPACE/build/android-release/QA_11_10_RELEASE_INPUT_MANIFEST.json"
          python tools/release_input_fingerprint.py \
            --compare "$GITHUB_WORKSPACE/build/android-release/release-input-manifest.json"

      - name: Destroy temporary secrets and downloaded tools
        if: always()
        run: rm -rf /tmp/veredas-release /tmp/veredas-qa-11-10 /tmp/godot /tmp/godot.zip /tmp/templates.tpz /tmp/godot-templates /tmp/bundletool.jar

      - name: Upload signed release artifact and provenance evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: veredas-signed-release-aab-${{ github.sha }}
          path: |
            build/android-release/veredas-da-trama.aab
            build/android-release/veredas-da-trama.aab.sha256
            build/android-release/release-input-manifest.json
            build/android-release/signature-verification.txt
            build/android-release/signing-identity-evidence.json
            build/android-release/aab-identity-evidence.json
            build/android-release/release-metadata.txt
            build/android-release/QA_11_10_COMPLETION.json
            build/android-release/QA_11_10_COMPLETION.json.sha256
            build/android-release/QA_11_10_RELEASE_INPUT_MANIFEST.json
            build/android-release/QA_11_10_RELEASE_INPUT_MANIFEST.json.sha256
          if-no-files-found: error
          retention-days: 14
