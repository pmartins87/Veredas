name: Veredas Wire Golden Slice

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/veredas-wire-golden-slice.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Wire authored director fail-closed
        shell: python
        run: |
          import json
          from pathlib import Path

          # project.godot: register authored story director.
          project = Path('projeto_jornada/project.godot')
          s = project.read_text(encoding='utf-8')
          old = 'EventDirector="*res://core/systems/EventDirector.gd"\nDifficultyEngine='
          new = 'EventDirector="*res://core/systems/EventDirector.gd"\nAuthoredStoryDirector="*res://core/systems/AuthoredStoryDirector.gd"\nDifficultyEngine='
          assert s.count(old) == 1, s.count(old)
          project.write_text(s.replace(old, new), encoding='utf-8')

          # RunFlowEngine: activate only on real player runs, prefer authored scenes, delegate authored choices, expose authored debrief.
          runflow = Path('projeto_jornada/core/systems/RunFlowEngine.gd')
          s = runflow.read_text(encoding='utf-8')
          old = '''        EchoConsequenceEngine.apply_to_run()\n    return true\n'''
          new = '''        EchoConsequenceEngine.apply_to_run()\n        AuthoredStoryDirector.activate_for_new_run()\n    return true\n'''
          assert s.count(old) == 1, ('activate', s.count(old))
          s = s.replace(old, new)

          old = '''func story_event() -> Dictionary:\n    GameState.run.mode = "story"\n    var event: Dictionary = EventDirector.choose_event(str(GameState.run.get("world_id", "")), str(GameState.run.get("location_id", "")))\n    if not event.is_empty() and not _simulation_no_persist():\n        MetaUnlockEngine.discover(str(event.get("id", "")))\n    return event\n'''
          new = '''func story_event() -> Dictionary:\n    GameState.run.mode = "story"\n    var event: Dictionary = AuthoredStoryDirector.current_event()\n    if not event.is_empty():\n        return event\n    event = EventDirector.choose_event(str(GameState.run.get("world_id", "")), str(GameState.run.get("location_id", "")))\n    if not event.is_empty() and not _simulation_no_persist():\n        MetaUnlockEngine.discover(str(event.get("id", "")))\n    return event\n'''
          assert s.count(old) == 1, ('story_event', s.count(old))
          s = s.replace(old, new)

          old = '''func choose(event: Dictionary, option: int) -> bool:\n    var choices: Array = event.get("choices", [])\n    if option < 0 or option >= choices.size():\n        return false\n    if not _simulation_no_persist():\n        MetaUnlockEngine.discover(str(event.get("id", "")))\n    return EventDirector.apply_choice(event, option)\n'''
          new = '''func choose(event: Dictionary, option: int) -> bool:\n    var choices: Array = event.get("choices", [])\n    if option < 0 or option >= choices.size():\n        return false\n    if AuthoredStoryDirector.is_authored_event(event):\n        return AuthoredStoryDirector.apply_choice(event, option)\n    if not _simulation_no_persist():\n        MetaUnlockEngine.discover(str(event.get("id", "")))\n    return EventDirector.apply_choice(event, option)\n'''
          assert s.count(old) == 1, ('choose', s.count(old))
          s = s.replace(old, new)

          old = '''func debrief() -> Dictionary:\n    return {\n        "result": GameState.run.get("result", "in_progress"),\n        "ending_id": GameState.run.get("ending_id", ""),\n        "turns": int(GameState.run.get("turn", 0)),\n        "visited_locations": GameState.run.get("visited_locations", []).duplicate(),\n        "defeated_enemies": GameState.run.get("defeated_enemies", []).duplicate(),\n        "purchases": GameState.run.get("purchases", []).duplicate(),\n        "loot_found": GameState.run.get("loot_found", []).duplicate(),\n        "marks": GameState.run.get("marks", {}).duplicate(true),\n        "echoes": EchoConsequenceEngine.summary(),\n    }\n'''
          new = '''func debrief() -> Dictionary:\n    var report := {\n        "result": GameState.run.get("result", "in_progress"),\n        "ending_id": GameState.run.get("ending_id", ""),\n        "turns": int(GameState.run.get("turn", 0)),\n        "visited_locations": GameState.run.get("visited_locations", []).duplicate(),\n        "defeated_enemies": GameState.run.get("defeated_enemies", []).duplicate(),\n        "purchases": GameState.run.get("purchases", []).duplicate(),\n        "loot_found": GameState.run.get("loot_found", []).duplicate(),\n        "marks": GameState.run.get("marks", {}).duplicate(true),\n        "echoes": EchoConsequenceEngine.summary(),\n    }\n    var authored := AuthoredStoryDirector.debrief()\n    if not authored.is_empty():\n        report["authored_debrief"] = authored\n    return report\n'''
          assert s.count(old) == 1, ('debrief', s.count(old))
          runflow.write_text(s, encoding='utf-8')

          # Main: display authored kicker, consume authored transitions, and give authored endings narrative priority.
          main = Path('projeto_jornada/scenes/Main.gd')
          s = main.read_text(encoding='utf-8')
          old = '''    var title_size := AccessibilityService.font_size(25)\n    var event_view := localization.localize_record(current_event)\n    story.text = "[font_size=%d][b]%s[/b][/font_size]\\n\\n%s" % [title_size, event_view.get("title",localization.text("main.story.default_title")), event_view.get("text","")]\n'''
          new = '''    var title_size := AccessibilityService.font_size(25)\n    var event_view := localization.localize_record(current_event)\n    var kicker := str(event_view.get("kicker", ""))\n    var kicker_block := ""\n    if kicker != "":\n        kicker_block = "[i]%s[/i]\\n\\n" % kicker\n    story.text = "%s[font_size=%d][b]%s[/b][/font_size]\\n\\n%s" % [kicker_block, title_size, event_view.get("title",localization.text("main.story.default_title")), event_view.get("text","")]\n'''
          assert s.count(old) == 1, ('render_story', s.count(old))
          s = s.replace(old, new)

          old = '''func _choose_story(index: int) -> void:\n    var pool := str(current_event.get("pool", ""))\n    if not RunFlowEngine.choose(current_event, index):\n        return\n    current_event = {}\n    match pool:\n        "creature":\n            var monsters := RunFlowEngine.local_monsters()\n            if not monsters.is_empty():\n                RunFlowEngine.start_combat(str(monsters[0].get("id","")))\n        "trade":\n            RunFlowEngine.open_merchant(8)\n        "route":\n            RunFlowEngine.open_travel()\n        _:\n            RunFlowEngine.resume_story()\n    _refresh()\n'''
          new = '''func _choose_story(index: int) -> void:\n    var pool := str(current_event.get("pool", ""))\n    var authored := AuthoredStoryDirector.is_authored_event(current_event)\n    if not RunFlowEngine.choose(current_event, index):\n        return\n    current_event = {}\n    if authored:\n        var transition := AuthoredStoryDirector.consume_transition()\n        if str(transition.get("type", "")) == "combat":\n            var enemy_id := str(transition.get("enemy_id", ""))\n            if enemy_id != "" and not ContentRegistry.get_record(enemy_id).is_empty():\n                RunFlowEngine.start_combat(enemy_id)\n            else:\n                RunFlowEngine.resume_story()\n        else:\n            RunFlowEngine.resume_story()\n        _refresh()\n        return\n    match pool:\n        "creature":\n            var monsters := RunFlowEngine.local_monsters()\n            if not monsters.is_empty():\n                RunFlowEngine.start_combat(str(monsters[0].get("id","")))\n        "trade":\n            RunFlowEngine.open_merchant(8)\n        "route":\n            RunFlowEngine.open_travel()\n        _:\n            RunFlowEngine.resume_story()\n    _refresh()\n'''
          assert s.count(old) == 1, ('choose_story', s.count(old))
          s = s.replace(old, new)

          old = '''func _render_debrief() -> void:\n    var report := RunFlowEngine.debrief()\n    var ending := ContentRegistry.get_record(str(report.get("ending_id","")))\n    var ending_view := localization.localize_record(ending)\n    story.text = localization.text("main.debrief.body") % [AccessibilityService.font_size(25), report.get("result",""), ending_view.get("name","—"), report.get("turns",0), report.get("visited_locations",[]).size(), report.get("defeated_enemies",[]).size(), report.get("purchases",[]).size(), report.get("marks",{}).size()]\n    _add_action_button(localization.text("main.debrief.restart"), func(): RunFlowEngine.start_journey("character.mata_fio_verde.01", int(Time.get_unix_time_from_system()) & 0x7fffffff); current_event = {}; _refresh(), true)\n'''
          new = '''func _render_debrief() -> void:\n    var report := RunFlowEngine.debrief()\n    var authored: Dictionary = report.get("authored_debrief", {}) as Dictionary\n    if not authored.is_empty():\n        story.text = "[font_size=%d][b]%s[/b][/font_size]\\n\\n%s\\n\\n[i]%s[/i]" % [AccessibilityService.font_size(25), str(authored.get("title", "Fim da jornada")), str(authored.get("text", "")), localization.text("main.debrief.authored_epilogue")]\n        _add_action_button(localization.text("main.debrief.restart"), func(): RunFlowEngine.start_journey("character.mata_fio_verde.01", int(Time.get_unix_time_from_system()) & 0x7fffffff); current_event = {}; _refresh(), true)\n        return\n    var ending := ContentRegistry.get_record(str(report.get("ending_id","")))\n    var ending_view := localization.localize_record(ending)\n    var result_key := "main.debrief.result.%s" % str(report.get("result", "in_progress"))\n    var result_label := localization.text(result_key)\n    if result_label == result_key:\n        result_label = localization.text("main.debrief.result.unknown")\n    story.text = localization.text("main.debrief.body") % [AccessibilityService.font_size(25), result_label, ending_view.get("name","—"), report.get("turns",0), report.get("visited_locations",[]).size(), report.get("defeated_enemies",[]).size(), report.get("purchases",[]).size(), report.get("marks",{}).size()]\n    _add_action_button(localization.text("main.debrief.restart"), func(): RunFlowEngine.start_journey("character.mata_fio_verde.01", int(Time.get_unix_time_from_system()) & 0x7fffffff); current_event = {}; _refresh(), true)\n'''
          assert s.count(old) == 1, ('debrief_main', s.count(old))
          main.write_text(s.replace(old, new), encoding='utf-8')

          # Localize internal run result tokens so raw values never reach the player again.
          ui_keys = {
              'pt_BR': {
                  'main.debrief.authored_epilogue': 'A jornada terminou, mas esta escolha continuará ecoando nas próximas Veredas.',
                  'main.debrief.result.victory': 'Vitória',
                  'main.debrief.result.defeat': 'Derrota',
                  'main.debrief.result.in_progress': 'Em andamento',
                  'main.debrief.result.unknown': 'Encerrada',
              },
              'en': {
                  'main.debrief.authored_epilogue': 'The journey is over, but this choice will echo through the Paths ahead.',
                  'main.debrief.result.victory': 'Victory',
                  'main.debrief.result.defeat': 'Defeat',
                  'main.debrief.result.in_progress': 'In progress',
                  'main.debrief.result.unknown': 'Ended',
              },
          }
          for locale, additions in ui_keys.items():
              path = Path(f'projeto_jornada/localization/ui/{locale}.json')
              data = json.loads(path.read_text(encoding='utf-8'))
              for key, value in additions.items():
                  assert key not in data, key
                  data[key] = value
              path.write_text(json.dumps(dict(sorted(data.items())), ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Authored data must be parseable and internally linked before commit.
          arc = json.loads(Path('projeto_jornada/content_authored/mata_fio_verde_golden_slice.json').read_text(encoding='utf-8'))
          assert arc['arc_id'] == 'golden_slice.mata_fio_verde.01'
          scenes = arc['scenes']
          assert arc['start_scene'] in scenes
          for scene_id, scene in scenes.items():
              assert len(scene['copy']['pt_BR']['choices']) == len(scene['choices']), scene_id
              assert len(scene['copy']['en']['choices']) == len(scene['choices']), scene_id
              for choice in scene['choices']:
                  if 'next' in choice:
                      assert choice['next'] in scenes, (scene_id, choice['next'])
                  if 'end' in choice:
                      assert choice['end'] in arc['endings'], (scene_id, choice['end'])
      - name: Static integrity checks
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python -m json.tool projeto_jornada/content_authored/mata_fio_verde_golden_slice.json >/dev/null
          python -m json.tool projeto_jornada/localization/ui/pt_BR.json >/dev/null
          python -m json.tool projeto_jornada/localization/ui/en.json >/dev/null
          grep -q 'AuthoredStoryDirector=' projeto_jornada/project.godot
          grep -q 'AuthoredStoryDirector.current_event' projeto_jornada/core/systems/RunFlowEngine.gd
          grep -q 'authored_debrief' projeto_jornada/scenes/Main.gd
      - name: Commit golden slice wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add projeto_jornada/project.godot projeto_jornada/core/systems/RunFlowEngine.gd projeto_jornada/scenes/Main.gd projeto_jornada/localization/ui/pt_BR.json projeto_jornada/localization/ui/en.json
          git commit -m 'runtime: wire authored Mata golden slice into player journeys'
          git push origin HEAD:main
