name: Veredas 10.4 Runtime Patch

on:
  push:
    branches:
      - projeto-jornada-snapshots
    paths:
      - '.github/workflows/veredas-104-runtime-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: projeto-jornada-snapshots
          fetch-depth: 0
      - name: Patch policy and simulation economy integration
        run: |
          python -c "import base64; exec(base64.b64decode('') )"
          git diff --check
          git diff -- projeto_jornada/core/systems/PlayerPolicyEngine.gd projeto_jornada/core/systems/JourneySimulationEngine.gd
      - name: Commit runtime economy integration
        run: |
          git config user.name 'Veredas CI'
          git config user.email 'actions@users.noreply.github.com'
          git add projeto_jornada/core/systems/PlayerPolicyEngine.gd projeto_jornada/core/systems/JourneySimulationEngine.gd
          git commit -m 'Integrate Phase 10.4 economy with simulation policies'
          git push origin HEAD:projeto-jornada-snapshots
