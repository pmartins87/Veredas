name: Veredas da Trama Android Emulator Matrix

on:
  workflow_run:
    workflows: ["Veredas da Trama Android Build"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  emulator-certification:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'projeto-jornada-snapshots')
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 29
            label: android10
          - api-level: 34
            label: android14
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Download APK artifact from successful build
        uses: actions/download-artifact@v4
        with:
          name: veredas-debug-apk
          path: android-artifact
          repository: ${{ github.repository }}
          run-id: ${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find android-artifact -type f -name '*.apk' -print -quit)
          test -n "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - name: Android ${{ matrix.api-level }} install, launch, suspend and resume certification
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: |
            set -euo pipefail
            PACKAGE='com.veredasdatrama.preview'
            APK='${{ steps.apk.outputs.path }}'
            adb install -r "$APK"
            adb shell pm path "$PACKAGE"

            adb logcat -c
            adb shell monkey -p "$PACKAGE" -c android.intent.category.LAUNCHER 1
            sleep 5
            PID=$(adb shell pidof "$PACKAGE" | tr -d '\r')
            test -n "$PID"

            # HOME drives the application-paused path, which must autosave.
            adb shell input keyevent KEYCODE_HOME
            sleep 3
            adb shell run-as "$PACKAGE" sh -c 'test -s files/veredas_run_v1.json'
            adb exec-out run-as "$PACKAGE" cat files/veredas_run_v1.json > /tmp/veredas-save-before.json
            python - <<'PY'
            import json
            p='/tmp/veredas-save-before.json'
            data=json.load(open(p,encoding='utf-8'))
            assert data['run']['active'] is True
            assert int(data['run']['seed']) > 0
            print('SAVE_BEFORE seed=',data['run']['seed'],'world=',data['run']['world_id'])
            PY
            SEED_BEFORE=$(python -c "import json; print(json.load(open('/tmp/veredas-save-before.json'))['run']['seed'])")

            adb shell am force-stop "$PACKAGE"
            sleep 2
            adb shell monkey -p "$PACKAGE" -c android.intent.category.LAUNCHER 1
            sleep 5
            PID=$(adb shell pidof "$PACKAGE" | tr -d '\r')
            test -n "$PID"
            adb shell input keyevent KEYCODE_HOME
            sleep 3
            adb exec-out run-as "$PACKAGE" cat files/veredas_run_v1.json > /tmp/veredas-save-after.json
            SEED_AFTER=$(python -c "import json; print(json.load(open('/tmp/veredas-save-after.json'))['run']['seed'])")
            test "$SEED_BEFORE" = "$SEED_AFTER"

            if adb logcat -d | grep -E 'SCRIPT ERROR|Parse Error|FATAL EXCEPTION.*com\.veredasdatrama\.preview'; then
              echo 'Runtime error found in Android logcat'
              exit 1
            fi
            echo "ANDROID_EMULATOR_CERTIFICATION PASS: API ${{ matrix.api-level }} seed $SEED_AFTER"

      - name: Write compatibility result
        run: |
          mkdir -p compatibility
          printf '%s\n' \
            'api_level=${{ matrix.api-level }}' \
            'label=${{ matrix.label }}' \
            'architecture=x86_64' \
            'result=pass' \
            > compatibility/${{ matrix.label }}.txt

      - name: Upload compatibility evidence
        uses: actions/upload-artifact@v4
        with:
          name: veredas-${{ matrix.label }}-compatibility
          path: compatibility/${{ matrix.label }}.txt
          retention-days: 14
