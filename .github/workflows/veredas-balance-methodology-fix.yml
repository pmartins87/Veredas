name: Veredas Balance Methodology Fix

on:
  push:
    branches:
      - projeto-jornada-snapshots
    paths:
      - '.github/workflows/veredas-balance-methodology-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: projeto-jornada-snapshots
          fetch-depth: 0
      - name: Apply controlled-policy fairness fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('projeto_jornada/tests/CharacterBalanceCertification.gd')
          text = p.read_text(encoding='utf-8')
          replacements = {
              '        scores.append(learned)\n': '        scores.append(competent)\n',
              '        expect(high - low <= 0.65, "%s has excessive learned-score spread among its three Andarilhos" % world_id)\n': '        expect(high - low <= 0.65, "%s has excessive controlled balanced-score spread among its three Andarilhos" % world_id)\n',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one methodology target for {old!r}, found {count}')
              text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git diff -- projeto_jornada/tests/CharacterBalanceCertification.gd
      - name: Commit methodology fix
        run: |
          git config user.name 'Veredas CI'
          git config user.email 'actions@users.noreply.github.com'
          git add projeto_jornada/tests/CharacterBalanceCertification.gd
          git commit -m 'Compare character fairness under a controlled balanced policy'
          git push origin HEAD:projeto-jornada-snapshots
