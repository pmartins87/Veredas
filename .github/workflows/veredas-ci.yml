name: Veredas da Trama CI

on:
  push:
    branches:
      - projeto-jornada-snapshots
  workflow_dispatch:

concurrency:
  group: veredas-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild mechanical balance baseline
        working-directory: projeto_jornada
        run: |
          python tools/rebuild_content.py
          python tools/refine_npc_authenticity.py
          python tools/refine_character_balance.py
          python tools/enforce_character_horizontal_budget.py
          python tools/refine_enemy_balance.py
          python tools/refine_item_economy.py

      - name: Validate mechanical baseline content
        working-directory: projeto_jornada
        run: python tools/validate_canonical.py

      - name: Validate Phase 7 integration
        working-directory: projeto_jornada
        run: python tools/validate_phase7_integration.py

      - name: Prepare and audit mobile asset pipeline
        working-directory: projeto_jornada
        run: |
          python tools/prepare_mobile_assets.py
          python tools/audit_mobile_assets.py
          python tools/validate_android_export.py

      - name: Download Godot 4.7.1 stable
        run: |
          curl -fL 'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7.1' -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --version

      - name: Import project headless
        run: |
          set -o pipefail
          output=$(/tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path projeto_jornada --editor --quit 2>&1)
          printf '%s\n' "$output"
          if printf '%s\n' "$output" | grep -E 'SCRIPT ERROR|Parse Error|Failed to load script'; then
            echo 'Godot import contained script/parser errors.'
            exit 1
          fi

      - name: Runtime smoke test
        run: |
          set -o pipefail
          output=$(/tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path projeto_jornada res://tests/runtime_smoke.tscn 2>&1)
          printf '%s\n' "$output"
          if printf '%s\n' "$output" | grep -E 'SCRIPT ERROR|Parse Error|RUNTIME_SMOKE FAIL'; then
            exit 1
          fi
          printf '%s\n' "$output" | grep -q 'RUNTIME_SMOKE PASS'

      - name: Phase 1-4 runtime certification
        run: |
          set -o pipefail
          output=$(/tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path projeto_jornada res://tests/phase_certification.tscn 2>&1)
          printf '%s\n' "$output"
          if printf '%s\n' "$output" | grep -E 'SCRIPT ERROR|Parse Error|PHASE_CERTIFICATION FAIL'; then
            exit 1
          fi
          printf '%s\n' "$output" | grep -q 'PHASE_CERTIFICATION PASS: 1.10 2.10 3.10 4.10'

      - name: Phase 8 mobile certification 8.1-8.4
        run: |
          set -o pipefail
          output=$(/tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path projeto_jornada res://tests/mobile_certification.tscn 2>&1)
          printf '%s\n' "$output"
          if printf '%s\n' "$output" | grep -E 'SCRIPT ERROR|Parse Error|MOBILE_CERTIFICATION FAIL'; then
            exit 1
          fi
          printf '%s\n' "$output" | grep -q 'MOBILE_CERTIFICATION PASS: 8.1 8.2 8.3 8.4'

      - name: Phase 8 performance budget certification 8.5
        run: |
          set -o pipefail
          output=$(/tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path projeto_jornada res://tests/performance_budget_certification.tscn 2>&1)
          printf '%s\n' "$output"
          if printf '%s\n' "$output" | grep -E 'SCRIPT ERROR|Parse Error|PERFORMANCE_BUDGET_CERTIFICATION FAIL'; then
            exit 1
          fi
          printf '%s\n' "$output" | grep -q 'PERFORMANCE_BUDGET_CERTIFICATION PASS: 8.5'

      - name: Phase 8 asset pipeline certification 8.6
        run: |
          set -o pipefail
          output=$(/tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path projeto_jornada res://tests/asset_pipeline_certification.tscn 2>&1)
          printf '%s\n' "$output"
          if printf '%s\n' "$output" | grep -E 'SCRIPT ERROR|Parse Error|ASSET_PIPELINE_CERTIFICATION FAIL'; then
            exit 1
          fi
          printf '%s\n' "$output" | grep -q 'ASSET_PIPELINE_CERTIFICATION PASS: 8.6'

      - name: Phase 9 Knot of Vigil certification 9.1
        run: |
          set -o pipefail
          output=$(/tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path projeto_jornada res://tests/hub_certification.tscn 2>&1)
          printf '%s\n' "$output"
          if printf '%s\n' "$output" | grep -E 'SCRIPT ERROR|Parse Error|HUB_CERTIFICATION FAIL'; then
            exit 1
          fi
          printf '%s\n' "$output" | grep -q 'HUB_CERTIFICATION PASS: 9.1'

      - name: Phase 9 horizontal unlock certification 9.2
        run: |
          set -o pipefail
          output=$(/tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path projeto_jornada res://tests/meta_unlock_certification.tscn 2>&1)
          printf '%s\n' "$output"
          if printf '%s\n' "$output" | grep -E 'SCRIPT ERROR|Parse Error|META_UNLOCK_CERTIFICATION FAIL'; then
            exit 1
          fi
          printf '%s\n' "$output" | grep -q 'META_UNLOCK_CERTIFICATION PASS: 9.2'

      - name: Phase 9 Echo consequence certification 9.3
        run: |
          bash projeto_jornada/tools/run_godot_gate.sh \
            /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            res://tests/echo_consequence_certification.tscn \
            'ECHO_CONSEQUENCE_CERTIFICATION FAIL' \
            'ECHO_CONSEQUENCE_CERTIFICATION PASS: 9.3'

      - name: Phase 9 journey setup certification 9.4
        run: |
          bash projeto_jornada/tools/run_godot_gate.sh \
            /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            res://tests/journey_setup_certification.tscn \
            'JOURNEY_SETUP_CERTIFICATION FAIL' \
            'JOURNEY_SETUP_CERTIFICATION PASS: 9.4'

      - name: Phase 9 Codex progression certification 9.5
        run: |
          bash projeto_jornada/tools/run_godot_gate.sh \
            /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            res://tests/codex_progress_certification.tscn \
            'CODEX_PROGRESS_CERTIFICATION FAIL' \
            'CODEX_PROGRESS_CERTIFICATION PASS: 9.5'

      - name: Phase 9 horizontal meta economy certification 9.6
        run: |
          bash projeto_jornada/tools/run_godot_gate.sh \
            /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            res://tests/meta_economy_certification.tscn \
            'META_ECONOMY_CERTIFICATION FAIL' \
            'META_ECONOMY_CERTIFICATION PASS: 9.6'

      - name: Phase 9 commercial policy certification 9.7
        run: |
          bash projeto_jornada/tools/run_godot_gate.sh \
            /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            res://tests/commercial_policy_certification.tscn \
            'COMMERCIAL_POLICY_CERTIFICATION FAIL' \
            'COMMERCIAL_POLICY_CERTIFICATION PASS: 9.7'

      - name: Phase 9 entitlement certification 9.8
        run: |
          bash projeto_jornada/tools/run_godot_gate.sh \
            /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            res://tests/entitlement_certification.tscn \
            'ENTITLEMENT_CERTIFICATION FAIL' \
            'ENTITLEMENT_CERTIFICATION PASS: 9.8'

      - name: Phase 9 profile migration certification 9.9
        run: |
          bash projeto_jornada/tools/run_godot_gate.sh \
            /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            res://tests/profile_migration_certification.tscn \
            'PROFILE_MIGRATION_CERTIFICATION FAIL' \
            'PROFILE_MIGRATION_CERTIFICATION PASS: 9.9'

      - name: Phase 9 complete multi-journey loop certification 9.10
        run: |
          bash projeto_jornada/tools/run_godot_gate.sh \
            /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            res://tests/multi_journey_loop_certification.tscn \
            'MULTI_JOURNEY_LOOP_CERTIFICATION FAIL' \
            'MULTI_JOURNEY_LOOP_CERTIFICATION PASS: 9.10'

      - name: Phase 10 complete journey simulator certification 10.1 baseline
        run: |
          bash projeto_jornada/tools/run_godot_gate.sh \
            /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            res://tests/journey_simulation_certification.tscn \
            'JOURNEY_SIMULATION_CERTIFICATION FAIL' \
            'JOURNEY_SIMULATION_CERTIFICATION PASS: 10.1'

      - name: Phase 10 character balance certification 10.2
        run: |
          bash projeto_jornada/tools/run_godot_gate.sh \
            /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            res://tests/character_balance_certification.tscn \
            'CHARACTER_BALANCE_CERTIFICATION FAIL' \
            'CHARACTER_BALANCE_CERTIFICATION PASS: 10.2'

      - name: Phase 10 enemy balance certification 10.3
        run: |
          bash projeto_jornada/tools/run_godot_gate.sh \
            /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            res://tests/enemy_balance_certification.tscn \
            'ENEMY_BALANCE_CERTIFICATION FAIL' \
            'ENEMY_BALANCE_CERTIFICATION PASS: 10.3'

      - name: Phase 10 item economy certification 10.4
        run: |
          bash projeto_jornada/tools/run_godot_gate.sh \
            /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            res://tests/item_economy_certification.tscn \
            'ITEM_ECONOMY_CERTIFICATION FAIL' \
            'ITEM_ECONOMY_CERTIFICATION PASS: 10.4'

      - name: Prepare Phase 10 narrative balance 10.5
        working-directory: projeto_jornada
        run: |
          python tools/refine_narrative_balance.py
          python tools/validate_canonical.py

      - name: Phase 10 narrative balance certification 10.5
        run: |
          bash projeto_jornada/tools/run_godot_gate.sh \
            /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            res://tests/narrative_balance_certification.tscn \
            'NARRATIVE_BALANCE_CERTIFICATION FAIL' \
            'NARRATIVE_BALANCE_CERTIFICATION PASS: 10.5'

      - name: Phase 10 integrated journey regression after 10.5
        run: |
          bash projeto_jornada/tools/run_godot_gate.sh \
            /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            res://tests/journey_simulation_certification.tscn \
            'JOURNEY_SIMULATION_CERTIFICATION FAIL' \
            'JOURNEY_SIMULATION_CERTIFICATION PASS: 10.1'

      - name: Phase 10 difficulty balance certification 10.6
        run: |
          bash projeto_jornada/tools/run_godot_gate.sh \
            /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            res://tests/difficulty_balance_certification.tscn \
            'DIFFICULTY_BALANCE_CERTIFICATION FAIL' \
            'DIFFICULTY_BALANCE_CERTIFICATION PASS: 10.6'

      - name: Phase 10 journey pacing and attrition certification 10.7
        run: |
          bash projeto_jornada/tools/run_godot_gate.sh \
            /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            res://tests/journey_pacing_certification.tscn \
            'JOURNEY_PACING_CERTIFICATION FAIL' \
            'JOURNEY_PACING_CERTIFICATION PASS: 10.7'

      - name: Phase 10 mass simulation, outlier and dominance certification 10.8
        run: |
          bash projeto_jornada/tools/run_godot_gate.sh \
            /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            res://tests/mass_simulation_certification.tscn \
            'MASS_SIMULATION_CERTIFICATION FAIL' \
            'MASS_SIMULATION_CERTIFICATION PASS: 10.8'
