name: Veredas da Trama CI

on:
  push:
    branches:
      - projeto-jornada-snapshots
  workflow_dispatch:

jobs:
  validate-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild canonical content
        working-directory: projeto_jornada
        run: python tools/rebuild_content.py

      - name: Validate canonical content
        working-directory: projeto_jornada
        run: python tools/validate_canonical.py

      - name: Validate Phase 7 integration
        working-directory: projeto_jornada
        run: python tools/validate_phase7_integration.py

      - name: Download Godot 4.7.1 stable
        run: |
          curl -fL 'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7.1' -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --version

      - name: Import project headless
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path projeto_jornada --editor --quit

      - name: Runtime smoke test
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path projeto_jornada res://tests/runtime_smoke.tscn
