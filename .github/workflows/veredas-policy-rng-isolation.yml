name: Veredas Policy RNG Isolation Patch

on:
  push:
    branches:
      - projeto-jornada-snapshots
    paths:
      - '.github/workflows/veredas-policy-rng-isolation.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: projeto-jornada-snapshots
          fetch-depth: 0
      - name: Separate policy RNG from world RNG
        run: |
          python - <<'PY'
          from pathlib import Path

          policy = Path('projeto_jornada/core/systems/PlayerPolicyEngine.gd')
          text = policy.read_text(encoding='utf-8')
          marker = 'const POLICIES := ["balanced", "aggressive", "cautious", "explorer", "random"]\n\n'
          insert = marker + (
              'var _decision_rng := RandomNumberGenerator.new()\n'
              'var _decision_rng_seeded := false\n\n'
              'func start_decision_rng(seed_value: int) -> void:\n'
              '    # Player-policy randomness is independent from world/combat RNG.\n'
              '    var mixed := absi(seed_value * 1664525 + 1013904223)\n'
              '    _decision_rng.seed = maxi(1, mixed)\n'
              '    _decision_rng_seeded = true\n\n'
              'func _ensure_decision_rng() -> void:\n'
              '    if not _decision_rng_seeded:\n'
              '        start_decision_rng(1)\n\n'
              'func _decision_range_int(minimum: int, maximum: int) -> int:\n'
              '    _ensure_decision_rng()\n'
              '    return _decision_rng.randi_range(minimum, maximum)\n\n'
              'func _decision_next_float() -> float:\n'
              '    _ensure_decision_rng()\n'
              '    return _decision_rng.randf()\n\n'
          )
          count = text.count(marker)
          if count != 1:
              raise SystemExit(f'Policy RNG insertion marker count={count}')
          text = text.replace(marker, insert, 1)
          range_count = text.count('RNGService.range_int(')
          float_count = text.count('RNGService.next_float()')
          if range_count != 5 or float_count != 1:
              raise SystemExit(f'Unexpected policy RNG call counts range={range_count} float={float_count}')
          text = text.replace('RNGService.range_int(', '_decision_range_int(')
          text = text.replace('RNGService.next_float()', '_decision_next_float()')
          policy.write_text(text, encoding='utf-8')

          simulator = Path('projeto_jornada/core/systems/JourneySimulationEngine.gd')
          text = simulator.read_text(encoding='utf-8')
          old = (
              '    if ContentRegistry.get_record(world_id).is_empty():\n'
              '        return _invalid_result(character_id, policy_id, build_id, seed_value, "invalid_world")\n\n'
              '    _prepare_isolated_profile(world_id, character_id)\n'
          )
          new = (
              '    if ContentRegistry.get_record(world_id).is_empty():\n'
              '        return _invalid_result(character_id, policy_id, build_id, seed_value, "invalid_world")\n\n'
              '    policy_engine.start_decision_rng(seed_value)\n'
              '    _prepare_isolated_profile(world_id, character_id)\n'
          )
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Simulator policy seed target count={count}')
          simulator.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          git diff -- projeto_jornada/core/systems/PlayerPolicyEngine.gd projeto_jornada/core/systems/JourneySimulationEngine.gd
      - name: Commit RNG isolation
        run: |
          git config user.name 'Veredas CI'
          git config user.email 'actions@users.noreply.github.com'
          git add projeto_jornada/core/systems/PlayerPolicyEngine.gd projeto_jornada/core/systems/JourneySimulationEngine.gd
          git commit -m 'Isolate simulated player decisions from world RNG'
          git push origin HEAD:projeto-jornada-snapshots
