name: Veredas Maintenance — Sync Certified Project State

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/veredas-maintenance-sync-project-state.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply fail-closed certified-state synchronization
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('projeto_jornada/PROJECT_STATE.json')
          state = json.loads(path.read_text(encoding='utf-8'))

          assert state['completed_steps'] == 110, state['completed_steps']
          assert state['phase11']['11.6'] == 'in_progress_execution_pending', state['phase11']['11.6']
          assert state['phase11']['11.9'] == 'in_progress_execution_pending', state['phase11']['11.9']
          assert state['repository_identity']['canonical_repository'] == 'pmartins87/Veredas'
          assert state['repository_identity']['visibility'] == 'private', state['repository_identity']['visibility']

          state['schema_version'] = 11
          state['repository_identity']['visibility'] = 'public'
          state['completed_steps'] = 112
          state['current_step'] = '11.7'
          state['current_step_title'] = 'QA audiovisual final e integração dos assets finais'

          state['phase11']['11.6'] = 'certified'
          state['phase11']['11.9'] = 'certified'

          certified = state.setdefault('phase11_certified_evidence', {})
          certified['11.6'] = {
              'completion_file': 'LOCALIZATION_11_6_COMPLETION.json',
              'status': 'pass',
              'certified_against_head': 'ec6f002735bee9e8a42e28ac91eba4cfa70e3aa0',
              'workflow_run_id': 31851261636,
              'launch_locales': ['pt_BR', 'en'],
              'english_covered_units': 19100,
              'english_total_launch_units': 19100,
              'english_missing_units': 0,
              'token_parity_errors': 0,
              'terminology_errors': 0,
              'overflow_gate_passed': True,
              'iconography_gate_passed': True,
          }
          certified['11.9'] = {
              'completion_file': 'RELIABILITY_11_9_COMPLETION.json',
              'status': 'pass',
              'certified_against_head': '8672a3e055c4a616aebfd5ccdbc5e08940eb985e',
              'workflow_run_id': 31850297926,
              'lifecycle_cycles': 128,
              'restart_rounds': 24,
              'reloads': 153,
              'integrity_audits': 155,
          }

          in_progress = state.setdefault('phase11_in_progress', {})
          in_progress.pop('11.6', None)
          in_progress.pop('11.9', None)

          state['execution_infrastructure'] = {
              'github_actions_status': 'hosted_runner_available_public_repository',
              'repository': 'pmartins87/Veredas',
              'branch': 'main',
              'repository_visibility': 'public',
              'historical_private_runner_non_execution': {
                  'run_id': 31817505319,
                  'job_id': 94822612274,
                  'runner_id': 0,
                  'steps': [],
              },
              'public_runner_recovery_verified': True,
              '11_6_certification_run_id': 31851261636,
              '11_6_certification_passed': True,
              '11_9_certification_run_id': 31850297926,
              '11_9_certification_passed': True,
              'ci_fanout_must_remain_controlled': True,
              'policy': 'only jobs that receive a runner and execute their gates may produce PASS/FAIL evidence',
          }

          state['phase12_preflight']['12.9']['backend_transitive_hash_lock'] = 'pending_certified_execution'
          state['phase12_preflight']['12.9']['backend_final_sbom'] = 'pending_certified_execution'

          path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          python -m json.tool projeto_jornada/PROJECT_STATE.json >/dev/null
          git diff --check
      - name: Persist synchronized state
        run: |
          git config user.name 'Veredas CI'
          git config user.email 'actions@users.noreply.github.com'
          git add projeto_jornada/PROJECT_STATE.json
          git diff --cached --check
          git commit -m 'state: synchronize 112 of 130 certified roadmap status'
          git push origin HEAD:main
