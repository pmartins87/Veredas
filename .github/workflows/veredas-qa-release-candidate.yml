name: Veredas QA Freeze 11.10

on:
  workflow_dispatch:
  push:
    branches:
      - projeto-jornada-snapshots
    paths:
      - 'projeto_jornada/PERFORMANCE_11_3_COMPLETION.json'
      - 'projeto_jornada/LOCALIZATION_11_6_COMPLETION.json'
      - 'projeto_jornada/AUDIOVISUAL_11_7_COMPLETION.json'
      - 'projeto_jornada/QA_11_8_COMPLETION.json'
      - 'projeto_jornada/RELIABILITY_11_9_COMPLETION.json'
      - 'projeto_jornada/mobile/**'
      - 'projeto_jornada/export_presets.cfg'
      - 'projeto_jornada/product/commercial_model.json'
      - 'projeto_jornada/product/legal_documents.json'
      - 'projeto_jornada/ROADMAP_STATE.md'
      - 'projeto_jornada/qa/**'
      - 'projeto_jornada/tests/**'
      - 'projeto_jornada/tools/qa_release_candidate_gate.py'
      - 'projeto_jornada/tools/write_qa_release_candidate_completion.py'
      - 'projeto_jornada/tools/release_version_identity_gate.py'
      - 'projeto_jornada/tools/release_input_fingerprint.py'
      - 'projeto_jornada/tools/release_input_scope_gate.py'
      - 'projeto_jornada/tools/release_workflow_integrity_gate.py'
      - '.github/workflows/veredas-qa-release-candidate.yml'
      - '.github/workflows/veredas-release-aab.yml'

concurrency:
  group: veredas-qa-release-candidate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GODOT_VERSION: '4.7.1-stable'
  GODOT_LINUX_X86_64_SHA256: 'c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba'

jobs:
  qa-freeze-11-10:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require release workflow control surface is pinned
        working-directory: projeto_jornada
        run: python tools/release_workflow_integrity_gate.py
      - name: Require certified Phase 11 prerequisites
        working-directory: projeto_jornada
        run: python tools/qa_release_candidate_gate.py
      - name: Require public Android version frozen before RC certification
        working-directory: projeto_jornada
        run: python tools/release_version_identity_gate.py --release
      - name: Preserve balance freeze 10.10
        working-directory: projeto_jornada
        run: python tools/verify_balance_freeze.py
      - name: Require zero blocker or critical product defects 11.8
        working-directory: projeto_jornada
        run: python tools/qa_triage_gate.py --require-zero
      - name: Preserve canonical content
        working-directory: projeto_jornada
        run: python tools/validate_canonical.py
      - name: Re-certify launch localization corpus
        working-directory: projeto_jornada
        run: |
          python tools/localization_pack_certification.py
          python tools/localization_quality_gate.py --require-complete --require-terminology
          python tools/localization_full_linguistic_sanity.py
      - name: Install pinned Godot 4.7.1 stable
        run: |
          set -euo pipefail
          curl -fL \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v4.7.1-stable_linux.x86_64.zip" \
            -o /tmp/godot.zip
          printf '%s  %s\n' "$GODOT_LINUX_X86_64_SHA256" /tmp/godot.zip | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --version | grep -q '^4.7.1.stable'
      - name: Import project headless
        run: |
          set -o pipefail
          output=$(/tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path projeto_jornada --editor --quit 2>&1)
          if printf '%s\n' "$output" | grep -E 'SCRIPT ERROR|Parse Error|Failed to load script'; then
            printf '%s\n' "$output"
            exit 1
          fi
      - name: Preserve regression matrix 11.1
        run: |
          bash projeto_jornada/tools/run_godot_gate.sh \
            /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            res://tests/regression_matrix_certification.tscn \
            'REGRESSION_MATRIX_CERTIFICATION FAIL' \
            'REGRESSION_MATRIX_CERTIFICATION PASS: 11.1'
      - name: Re-certify localization overflow 11.6
        run: |
          bash projeto_jornada/tools/run_godot_gate.sh \
            /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            res://tests/localization_overflow_certification.tscn \
            'LOCALIZATION_OVERFLOW_CERTIFICATION FAIL' \
            'LOCALIZATION_OVERFLOW_CERTIFICATION PASS: 11.6'
      - name: Re-certify localization iconography 11.6
        run: |
          bash projeto_jornada/tools/run_godot_gate.sh \
            /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            res://tests/localization_iconography_certification.tscn \
            'LOCALIZATION_ICONOGRAPHY_CERTIFICATION FAIL' \
            'LOCALIZATION_ICONOGRAPHY_CERTIFICATION PASS: 11.6'
      - name: Re-certify audiovisual context 11.7
        run: |
          bash projeto_jornada/tools/run_godot_gate.sh \
            /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            res://tests/audiovisual_context_certification.tscn \
            'AUDIOVISUAL_CONTEXT_CERTIFICATION FAIL' \
            'AUDIOVISUAL_CONTEXT_CERTIFICATION PASS: 11.7'
      - name: Re-certify reliability soak 11.9
        run: |
          bash projeto_jornada/tools/run_godot_gate.sh \
            /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            res://tests/reliability_soak_certification.tscn \
            'RELIABILITY_SOAK_CERTIFICATION FAIL' \
            'RELIABILITY_SOAK_CERTIFICATION PASS: 11.9'
      - name: Require repository remains clean
        run: git diff --exit-code
      - name: Freeze exact release input fingerprint for this RC
        working-directory: projeto_jornada
        run: |
          python tools/release_input_scope_gate.py
          python tools/release_input_fingerprint.py \
            --output /tmp/QA_11_10_RELEASE_INPUT_MANIFEST.json
      - name: Write 11.10 completion evidence after all gates pass
        run: |
          python projeto_jornada/tools/write_qa_release_candidate_completion.py \
            --output /tmp/QA_11_10_COMPLETION.json \
            --workflow-run-id '${{ github.run_id }}' \
            --release-input-manifest /tmp/QA_11_10_RELEASE_INPUT_MANIFEST.json
      - name: Upload 11.10 completion evidence
        uses: actions/upload-artifact@v4
        with:
          name: veredas-qa-11-10-completion
          path: |
            /tmp/QA_11_10_COMPLETION.json
            /tmp/QA_11_10_RELEASE_INPUT_MANIFEST.json
          if-no-files-found: error
          retention-days: 30
