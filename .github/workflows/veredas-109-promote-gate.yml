name: Veredas 10.9 Promote Adversarial Gate

on:
  push:
    branches:
      - projeto-jornada-snapshots
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: veredas-109-promote-${{ github.ref }}
  cancel-in-progress: true

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: projeto-jornada-snapshots
          fetch-depth: 0
      - name: Promote permanent gate and roadmap state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          ci = Path('.github/workflows/veredas-ci.yml')
          text = ci.read_text(encoding='utf-8')
          marker = '      - name: Phase 10 adversarial manual-style playtest certification 10.9\n'
          if marker not in text:
              block = '''\n\n      - name: Phase 10 adversarial manual-style playtest certification 10.9\n        run: |\n          bash projeto_jornada/tools/run_godot_gate.sh \\\n            /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \\\n            res://tests/adversarial_playtest_certification.tscn \\\n            'ADVERSARIAL_PLAYTEST_CERTIFICATION FAIL' \\\n            'ADVERSARIAL_PLAYTEST_CERTIFICATION PASS: 10.9'\n'''
              ci.write_text(text.rstrip() + block, encoding='utf-8')

          state_path = Path('projeto_jornada/PROJECT_STATE.json')
          state = json.loads(state_path.read_text(encoding='utf-8'))
          state['completed_steps'] = 103
          state['completed_through'] = '10.8'
          state['current_step'] = '10.9'
          state['current_step_title'] = 'Playtests adversariais/manuais e correção dos resultados da simulação'
          state['phase10']['10.8'] = 'certified'
          state['phase10']['10.9'] = 'in_progress'
          state['last_certified_ci'] = {
              'run_id': 31344471146,
              'commit': '31baec22cfd7f29c7a0c944302fad36de854befb',
              'character_balance_runs': 1296,
              'character_balance_result': 'PASS',
              'enemy_balance_combats': 2340,
              'enemy_balance_result': 'PASS',
              'item_economy_items': 1116,
              'item_economy_result': 'PASS',
              'narrative_balance_runs': 216,
              'narrative_selections': 12960,
              'narrative_coverage': 0.927,
              'narrative_balance_result': 'PASS',
              'difficulty_balance_runs': 1728,
              'difficulty_balance_result': 'PASS',
              'journey_pacing_runs': 1728,
              'journey_pacing_result': 'PASS',
              'mass_simulation_runs': 17280,
              'mass_simulation_invalid': 0,
              'mass_simulation_deadlocks': 0,
              'mass_simulation_stalemate_rate': 0.0027,
              'mass_simulation_very_long_rate': 0.0221,
              'policy_context_wins': {'balanced':130,'aggressive':102,'cautious':191,'explorer':90,'ties':63},
              'build_context_wins': {'offense':415,'defense':167,'utility':81,'ties':57},
              'rupture_synthetic_build_victory': {'baseline':0.0111,'offense':0.2731,'defense':0.1389,'utility':0.0722},
              'recommendation_worst_regret': 0.290,
              'feasible_rupture_runs': 4608,
              'feasible_rupture_victory': 0.0126,
              'feasible_rupture_stalemate_rate': 0.0004,
              'feasible_rupture_max_local_victory': 0.219,
              'mass_simulation_result': 'PASS'
          }
          state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          roadmap = Path('projeto_jornada/ROADMAP_STATE.md')
          r = roadmap.read_text(encoding='utf-8')
          r = r.replace('Fase 10: **10.1–10.7 ✅ certificados; 10.8 está em andamento**.', 'Fase 10: **10.1–10.8 ✅ certificados; 10.9 está em andamento**.')
          r = r.replace('- 10.8 🟡 Simulações massivas, detecção de outliers e estratégias dominantes — em andamento.\n- 10.9–10.10 ⏳ Pendentes após certificação de 10.8.', '- 10.8 ✅ Simulações massivas, detecção de outliers e estratégias dominantes — 17.280 jornadas massivas + 4.608 jornadas factíveis em Ruptura, zero deadlocks estruturais, dominância/regret/outliers certificados.\n- 10.9 🟡 Playtests adversariais/manuais e correção dos resultados da simulação — em andamento; 9 roteiros manual-style já verdes no diagnóstico dedicado.\n- 10.10 ⏳ Freeze final de balanceamento após certificação de 10.9.')
          r = r.replace('- **102/130 passos concluídos segundo seus gates.**', '- **103/130 passos concluídos segundo seus gates.**')
          anchor = '- run 31340262854 / commit `00dde061`:'
          new_line = '- run 31344471146 / commit `31baec22`: CI canônica limpa com 10.1–10.8 todos verdes e `MASS_SIMULATION_CERTIFICATION PASS: 10.8`. A matriz principal executou 17.280 jornadas com 0 inválidas, 0 deadlocks, 0,27% de stalemates e 2,21% acima de 35 passos; políticas e builds permaneceram plurais. O stress factível em Ruptura executou mais 4.608 jornadas, com 1,26% de vitória agregada, 0,04% de stalemates e máximo local de 21,9%. O cap de Guarda inicial em 6 e as recomendações empíricas de política permaneceram verdes. Todos os workflows/probes temporários da 10.8 e probes órfãos antigos foram removidos antes deste gate final;\n'
          if new_line not in r:
              pos = r.find(anchor)
              if pos >= 0:
                  end = r.find('\n', pos)
                  r = r[:end+1] + new_line + r[end+1:]
          roadmap.write_text(r, encoding='utf-8')
          PY
          rm -f .github/workflows/veredas-109-adversarial-diagnostic.yml
          rm -f .github/workflows/veredas-109-promote-gate.yml
          git config user.name 'Veredas CI'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/veredas-ci.yml .github/workflows/veredas-109-adversarial-diagnostic.yml .github/workflows/veredas-109-promote-gate.yml projeto_jornada/PROJECT_STATE.json projeto_jornada/ROADMAP_STATE.md projeto_jornada/tests/AdversarialPlaytestCertification.gd projeto_jornada/tests/adversarial_playtest_certification.tscn
          git diff --cached --check
          git commit -m 'test: promote adversarial playtest gate 10.9'
          git push origin HEAD:projeto-jornada-snapshots
