name: Veredas 10.3 Diagnostic Gate Fix

on:
  push:
    branches:
      - projeto-jornada-snapshots
    paths:
      - '.github/workflows/veredas-103-diagnostic-gate-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: projeto-jornada-snapshots
          fetch-depth: 0
      - name: Align diagnostic gate with current boss budget
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('projeto_jornada/tests/EnemyBalanceCertification.gd')
          text = p.read_text(encoding='utf-8')
          replacements = {
              'expect(int(boss.get("hp", 0)) >= 36 and int(boss.get("hp", 0)) <= 52, "%s boss HP outside anti-sponge envelope" % boss_id)':
              'expect(int(boss.get("hp", 0)) >= 30 and int(boss.get("hp", 0)) <= 38, "%s boss HP outside anti-sponge envelope" % boss_id)',
              'expect(int(boss.get("posture", 0)) >= 16 and int(boss.get("posture", 0)) <= 24, "%s boss posture outside anti-sponge envelope" % boss_id)':
              'expect(int(boss.get("posture", 0)) >= 15 and int(boss.get("posture", 0)) <= 19, "%s boss posture outside anti-sponge envelope" % boss_id)',
              '            var changed := int(monster.get("starting_guard",0)) != 0 or int(monster.get("posture",0)) != int(bare.get("posture",0))':
              '            var changed: bool = int(monster.get("starting_guard",0)) != 0 or int(monster.get("posture",0)) != int(bare.get("posture",0))',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one target, found {count}: {old[:80]}')
              text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git diff -- projeto_jornada/tests/EnemyBalanceCertification.gd
      - name: Commit diagnostic fix
        run: |
          git config user.name 'Veredas CI'
          git config user.email 'actions@users.noreply.github.com'
          git add projeto_jornada/tests/EnemyBalanceCertification.gd
          git commit -m 'Align Phase 10.3 diagnostic gate with anti-sponge boss budget'
          git push origin HEAD:projeto-jornada-snapshots
