name: Veredas 10.8 Recommendation Validation

on:
  push:
    branches:
      - projeto-jornada-snapshots
  workflow_dispatch:

concurrency:
  group: veredas-108-recommendation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch high-confidence recommendations locally
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('projeto_jornada/tools/refine_character_balance.py')
          s=p.read_text(encoding='utf-8')
          changes={
            '"Barqueiro do Reflexo": ("move", "counter", "balanced",':'"Barqueiro do Reflexo": ("move", "counter", "explorer",',
            '"Lanceiro Solar": ("damage", "range", "aggressive",':'"Lanceiro Solar": ("damage", "range", "cautious",',
            '"Engenheira de Pontes": ("guard", "resource", "balanced",':'"Engenheira de Pontes": ("guard", "resource", "cautious",',
            '"Portador da Brasa": ("damage", "resource", "aggressive",':'"Portador da Brasa": ("damage", "resource", "balanced",',
            '"Repetente": ("echo", "counter", "balanced",':'"Repetente": ("echo", "counter", "cautious",',
            '"Tecelão Fraturado": ("resource", "status", "explorer",':'"Tecelão Fraturado": ("resource", "status", "balanced",',
          }
          for old,new in changes.items():
              if s.count(old)!=1: raise SystemExit(f'anchor mismatch {old}: {s.count(old)}')
              s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Rebuild mechanical fixture
        working-directory: projeto_jornada
        run: |
          python tools/rebuild_content.py >/dev/null
          python tools/refine_npc_authenticity.py >/dev/null
          python tools/refine_character_balance.py >/dev/null
          python tools/enforce_character_horizontal_budget.py >/dev/null
          python tools/refine_enemy_balance.py >/dev/null
          python tools/refine_item_economy.py >/dev/null
      - name: Download Godot
        run: |
          curl -fsSL 'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7.1' -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path projeto_jornada --editor --quit >/dev/null 2>&1
      - name: Re-certify 10.2
        run: |
          bash projeto_jornada/tools/run_godot_gate.sh /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 res://tests/character_balance_certification.tscn 'CHARACTER_BALANCE_CERTIFICATION FAIL' 'CHARACTER_BALANCE_CERTIFICATION PASS: 10.2'
      - name: Add narrative fixture
        working-directory: projeto_jornada
        run: python tools/refine_narrative_balance.py >/dev/null
      - name: Re-certify 10.6
        run: |
          bash projeto_jornada/tools/run_godot_gate.sh /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 res://tests/difficulty_balance_certification.tscn 'DIFFICULTY_BALANCE_CERTIFICATION FAIL' 'DIFFICULTY_BALANCE_CERTIFICATION PASS: 10.6'
      - name: Re-certify 10.7
        run: |
          bash projeto_jornada/tools/run_godot_gate.sh /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 res://tests/journey_pacing_certification.tscn 'JOURNEY_PACING_CERTIFICATION FAIL' 'JOURNEY_PACING_CERTIFICATION PASS: 10.7'
