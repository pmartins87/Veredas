name: Veredas Maintenance — Persist Backend Dependency Evidence

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/veredas-maintenance-persist-backend-evidence.yml'

permissions:
  actions: read
  contents: write

jobs:
  persist:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download exact successful evidence artifact
        uses: actions/download-artifact@v4
        with:
          name: veredas-backend-dependency-evidence-f5937a95d4de1495436325bf8e5b1423e9bad994
          path: /tmp/backend-evidence
          github-token: ${{ github.token }}
          repository: pmartins87/Veredas
          run-id: 31851792108
      - name: Verify exact evidence bytes
        run: |
          set -euo pipefail
          printf '%s  %s\n' '32632ae1ce714af4f55e4c63102909cec85fc19cee7329656b9082e259fbab47' /tmp/backend-evidence/requirements.lock | sha256sum -c -
          printf '%s  %s\n' 'fcf33fc9dab2650b1c239390ddf5fbeab5dbcfc8f0b4e68207d77d9d5199e818' /tmp/backend-evidence/software_sbom.json | sha256sum -c -
          printf '%s  %s\n' '2fc434ad2c4f2843aa190b518e1db680e42a175db218aedb48933f1a949b170a' /tmp/backend-evidence/backend-dependency-evidence-validation.json | sha256sum -c -
          printf '%s  %s\n' 'a33fc1a1a6d7ac2952896dfdbf60553f203e50204ffaa8f0e452e4ef6df9bf0f' /tmp/backend-evidence/veredas-resolved.txt | sha256sum -c -
      - name: Persist canonical evidence files
        run: |
          set -euo pipefail
          cp /tmp/backend-evidence/requirements.lock projeto_jornada/backend/play_purchase_verifier/requirements.lock
          cp /tmp/backend-evidence/software_sbom.json projeto_jornada/product/software_sbom.json
          cp /tmp/backend-evidence/backend-dependency-evidence-validation.json projeto_jornada/product/backend_dependency_evidence_validation.json
          python - <<'PY'
          import json
          from pathlib import Path
          record = {
              'schema_version': 1,
              'roadmap_step': '12.9',
              'status': 'pass',
              'source_workflow_run_id': 31851792108,
              'source_workflow_job_id': 94928810551,
              'source_head_sha': 'f5937a95d4de1495436325bf8e5b1423e9bad994',
              'source_artifact_id': 9237746247,
              'source_artifact_digest': 'sha256:e7ec5b28c393482dbeb0a3f34ccc895f767bee3a713f480b7d1a2d0a38077e03',
              'environment': {'python': '3.12.13', 'system': 'Linux', 'machine': 'x86_64'},
              'direct_requirement_count': 5,
              'locked_component_count': 29,
              'requirements_lock_sha256': '32632ae1ce714af4f55e4c63102909cec85fc19cee7329656b9082e259fbab47',
              'software_sbom_sha256': 'fcf33fc9dab2650b1c239390ddf5fbeab5dbcfc8f0b4e68207d77d9d5199e818',
              'validation_report_sha256': '2fc434ad2c4f2843aa190b518e1db680e42a175db218aedb48933f1a949b170a',
              'resolved_freeze_sha256': 'a33fc1a1a6d7ac2952896dfdbf60553f203e50204ffaa8f0e452e4ef6df9bf0f',
              'offline_require_hashes_reinstall_passed': True,
              'pip_check_passed_before_and_after_reinstall': True,
              'resolved_vs_reinstalled_freeze_equal': True,
              'backend_imports_passed': True,
          }
          Path('projeto_jornada/product/backend_dependency_evidence_record.json').write_text(
              json.dumps(record, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          PY
      - name: Validate persisted evidence with canonical gate
        working-directory: projeto_jornada
        run: |
          python tools/backend_dependency_evidence_gate.py \
            --require-evidence \
            --output /tmp/persisted-backend-dependency-evidence-validation.json
      - name: Persist verified evidence
        run: |
          git config user.name 'Veredas CI'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            projeto_jornada/backend/play_purchase_verifier/requirements.lock \
            projeto_jornada/product/software_sbom.json \
            projeto_jornada/product/backend_dependency_evidence_validation.json \
            projeto_jornada/product/backend_dependency_evidence_record.json
          git diff --cached --check
          git commit -m 'release: persist verified backend dependency lock and SBOM'
          git push origin HEAD:main
