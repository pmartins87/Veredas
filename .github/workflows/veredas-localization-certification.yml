name: Veredas Localization Certification 11.6

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/veredas-localization-certification.yml'

permissions:
  contents: write

concurrency:
  group: veredas-localization-certification-11-6
  cancel-in-progress: false

env:
  GODOT_VERSION: '4.7.1-stable'
  GODOT_LINUX_X86_64_SHA256: 'c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba'

jobs:
  certify-11-6:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Freeze exact certification HEAD
        run: echo "CERTIFIED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Rebuild integrated canonical fixture
        working-directory: projeto_jornada
        run: |
          python tools/rebuild_content.py >/dev/null
          python tools/refine_npc_authenticity.py >/dev/null
          python tools/refine_character_balance.py >/dev/null
          python tools/enforce_character_horizontal_budget.py >/dev/null
          python tools/refine_enemy_balance.py >/dev/null
          python tools/refine_item_economy.py >/dev/null
          python tools/refine_narrative_balance.py >/dev/null
          python tools/validate_canonical.py >/dev/null
      - name: Certify complete compact launch content packs
        working-directory: projeto_jornada
        run: |
          python tools/localization_pack_certification.py \
            --output /tmp/veredas-localization-pack-certification.json
          python tools/localization_inventory.py
      - name: Require complete terminology-safe launch localization
        working-directory: projeto_jornada
        run: |
          python tools/localization_quality_gate.py \
            --require-complete \
            --require-terminology \
            --output /tmp/veredas-localization-quality.json
      - name: Run full-corpus linguistic sanity audit
        working-directory: projeto_jornada
        run: |
          python tools/localization_full_linguistic_sanity.py \
            --output /tmp/veredas-full-linguistic-sanity.json
      - name: Install pinned Godot 4.7.1 stable
        run: |
          set -euo pipefail
          curl -fL \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v4.7.1-stable_linux.x86_64.zip" \
            -o /tmp/godot.zip
          printf '%s  %s\n' "$GODOT_LINUX_X86_64_SHA256" /tmp/godot.zip | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --version | grep -q '^4.7.1.stable'
      - name: Import project headless
        run: |
          set -o pipefail
          output=$(/tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path projeto_jornada --editor --quit 2>&1)
          if printf '%s\n' "$output" | grep -E 'SCRIPT ERROR|Parse Error|Failed to load script'; then
            printf '%s\n' "$output"
            exit 1
          fi
      - name: Preserve localization architecture fallback baseline 11.5
        run: |
          bash projeto_jornada/tools/run_godot_gate.sh \
            /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            res://tests/localization_architecture_certification.tscn \
            'LOCALIZATION_ARCHITECTURE_CERTIFICATION FAIL' \
            'LOCALIZATION_ARCHITECTURE_CERTIFICATION PASS: 11.5'
      - name: Certify localized overflow matrix 11.6
        run: |
          bash projeto_jornada/tools/run_godot_gate.sh \
            /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            res://tests/localization_overflow_certification.tscn \
            'LOCALIZATION_OVERFLOW_CERTIFICATION FAIL' \
            'LOCALIZATION_OVERFLOW_CERTIFICATION PASS: 11.6'
      - name: Certify localized iconography and accessible labels 11.6
        run: |
          bash projeto_jornada/tools/run_godot_gate.sh \
            /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            res://tests/localization_iconography_certification.tscn \
            'LOCALIZATION_ICONOGRAPHY_CERTIFICATION FAIL' \
            'LOCALIZATION_ICONOGRAPHY_CERTIFICATION PASS: 11.6'
      - name: Preserve responsive/accessibility regression 11.4
        run: |
          bash projeto_jornada/tools/run_godot_gate.sh \
            /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            res://tests/responsive_accessibility_certification.tscn \
            'RESPONSIVE_ACCESSIBILITY_CERTIFICATION FAIL' \
            'RESPONSIVE_ACCESSIBILITY_CERTIFICATION PASS: 11.4'
      - name: Write formal 11.6 completion evidence
        env:
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          quality = json.loads(Path('/tmp/veredas-localization-quality.json').read_text(encoding='utf-8'))
          pack = json.loads(Path('/tmp/veredas-localization-pack-certification.json').read_text(encoding='utf-8'))
          linguistic = json.loads(Path('/tmp/veredas-full-linguistic-sanity.json').read_text(encoding='utf-8'))
          en = quality['locales']['en']
          if quality.get('errors'):
              raise SystemExit('quality report contains errors after PASS')
          if int(en['covered_units']) != int(en['total_units']) or int(en['missing_units']) != 0:
              raise SystemExit('launch localization is not complete')
          row = {
              'schema_version': 1,
              'roadmap_step': '11.6',
              'status': 'pass',
              'certified_on': datetime.now(timezone.utc).date().isoformat(),
              'certified_against_head': os.environ['CERTIFIED_HEAD'],
              'workflow': '.github/workflows/veredas-localization-certification.yml',
              'workflow_run_id': int(os.environ['WORKFLOW_RUN_ID']),
              'launch_locales': ['pt_BR', 'en'],
              'deferred_locales': ['es_419'],
              'result': {
                  'english_covered_units': int(en['covered_units']),
                  'english_total_launch_units': int(en['total_units']),
                  'english_missing_units': int(en['missing_units']),
                  'token_parity_errors': len(en['token_parity_errors']),
                  'terminology_errors': len(en['terminology_errors']),
                  'pack_certification_errors': len(pack.get('errors', [])),
                  'linguistic_sanity_errors': len(linguistic.get('errors', [])),
                  'architecture_fallback_preserved': True,
                  'overflow_gate_passed': True,
                  'iconography_gate_passed': True,
                  'responsive_accessibility_regression_passed': True,
              },
              'certification_note': 'All launch-localization gates executed on one exact Veredas/main HEAD. The source-only architecture fallback probe remains intentionally untranslated and is excluded only from public launch coverage.'
          }
          Path('projeto_jornada/LOCALIZATION_11_6_COMPLETION.json').write_text(
              json.dumps(row, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          PY
      - name: Refuse stale certification if main moved
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$CERTIFIED_HEAD"
      - name: Persist formal 11.6 completion
        run: |
          git config user.name 'Veredas CI'
          git config user.email 'actions@users.noreply.github.com'
          git add projeto_jornada/LOCALIZATION_11_6_COMPLETION.json
          git diff --cached --check
          git commit -m 'state: certify localization 11.6'
          git push origin HEAD:main
      - name: Upload 11.6 certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veredas-localization-11-6-certification
          path: |
            /tmp/veredas-localization-pack-certification.json
            /tmp/veredas-localization-quality.json
            /tmp/veredas-full-linguistic-sanity.json
            projeto_jornada/LOCALIZATION_11_6_COMPLETION.json
          if-no-files-found: ignore
          retention-days: 30
