name: Veredas Continuity and Support 12.9

on:
  push:
    branches:
      - projeto-jornada-snapshots
    paths:
      - 'projeto_jornada/RELEASE_12_6_STATE.json'
      - 'projeto_jornada/RELEASE_12_9_STATE.json'
      - 'projeto_jornada/mobile/release_artifact_contract.json'
      - 'projeto_jornada/product/continuity_support_contract.json'
      - 'projeto_jornada/product/release_provenance.json'
      - 'projeto_jornada/product/release_archive_manifest.json'
      - 'projeto_jornada/product/third_party_notices.json'
      - 'projeto_jornada/product/third_party_licenses/**'
      - 'projeto_jornada/backend/play_purchase_verifier/requirements.txt'
      - 'projeto_jornada/backend/play_purchase_verifier/requirements.lock'
      - 'projeto_jornada/product/software_sbom.json'
      - 'projeto_jornada/product/android_dependency_inventory.json'
      - 'projeto_jornada/docs/CONTINUITY_AND_SUPPORT.md'
      - 'projeto_jornada/tools/release_input_fingerprint.py'
      - 'projeto_jornada/tools/release_input_scope_gate.py'
      - 'projeto_jornada/tools/build_backend_dependency_evidence.py'
      - 'projeto_jornada/tools/backend_dependency_evidence_gate.py'
      - 'projeto_jornada/tools/third_party_notices_gate.py'
      - 'projeto_jornada/tools/provenance_license_gate.py'
      - 'projeto_jornada/tools/release_archive_gate.py'
      - 'projeto_jornada/tools/continuity_support_gate.py'
      - '.github/workflows/veredas-backend-dependency-evidence.yml'
      - '.github/workflows/veredas-continuity-support.yml'
  workflow_dispatch:
    inputs:
      certify_release:
        description: 'Run the fail-closed final 12.9 continuity gate (not just preflight)'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: veredas-continuity-support-${{ github.ref }}
  cancel-in-progress: false

jobs:
  continuity-support:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate acyclic runtime/build fingerprint scope
        working-directory: projeto_jornada
        run: |
          python tools/release_input_scope_gate.py
          python tools/release_input_fingerprint.py --output /tmp/veredas-12-9-release-input-preflight.json
      - name: Validate backend dependency evidence state
        working-directory: projeto_jornada
        run: python tools/backend_dependency_evidence_gate.py --output /tmp/veredas-12-9-backend-dependencies-preflight.json
      - name: Validate third-party notice coverage state
        working-directory: projeto_jornada
        run: python tools/third_party_notices_gate.py --output /tmp/veredas-12-9-third-party-notices-preflight.json
      - name: Validate asset provenance, third-party software and service inventory
        working-directory: projeto_jornada
        run: python tools/provenance_license_gate.py --output /tmp/veredas-12-9-provenance-preflight.json
      - name: Validate canonical release archive identity and required evidence set
        working-directory: projeto_jornada
        run: python tools/release_archive_gate.py --output /tmp/veredas-12-9-archive-preflight.json
      - name: Validate 12.9 continuity and support contract
        working-directory: projeto_jornada
        run: python tools/continuity_support_gate.py --output /tmp/veredas-12-9-preflight.json
      - name: Preserve zero release-blocking product defects
        working-directory: projeto_jornada
        run: python tools/qa_triage_gate.py --require-zero
      - name: Run final backend dependency evidence certification
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.certify_release }}
        working-directory: projeto_jornada
        run: python tools/backend_dependency_evidence_gate.py --release --output /tmp/veredas-12-9-backend-dependencies-release.json
      - name: Run final third-party notice certification
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.certify_release }}
        working-directory: projeto_jornada
        run: python tools/third_party_notices_gate.py --release --output /tmp/veredas-12-9-third-party-notices-release.json
      - name: Run final provenance/license certification
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.certify_release }}
        working-directory: projeto_jornada
        run: python tools/provenance_license_gate.py --release --output /tmp/veredas-12-9-provenance-release.json
      - name: Run final canonical archive certification
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.certify_release }}
        working-directory: projeto_jornada
        run: python tools/release_archive_gate.py --release --output /tmp/veredas-12-9-archive-release.json
      - name: Run final 12.9 continuity certification
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.certify_release }}
        working-directory: projeto_jornada
        run: python tools/continuity_support_gate.py --release --output /tmp/veredas-12-9-release.json
      - name: Upload 12.9 reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veredas-12-9-continuity-support
          path: |
            /tmp/veredas-12-9-release-input-preflight.json
            /tmp/veredas-12-9-backend-dependencies-preflight.json
            /tmp/veredas-12-9-third-party-notices-preflight.json
            /tmp/veredas-12-9-provenance-preflight.json
            /tmp/veredas-12-9-archive-preflight.json
            /tmp/veredas-12-9-preflight.json
            /tmp/veredas-12-9-backend-dependencies-release.json
            /tmp/veredas-12-9-third-party-notices-release.json
            /tmp/veredas-12-9-provenance-release.json
            /tmp/veredas-12-9-archive-release.json
            /tmp/veredas-12-9-release.json
          if-no-files-found: ignore
          retention-days: 14
