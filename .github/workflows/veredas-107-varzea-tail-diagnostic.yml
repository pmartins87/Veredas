name: Veredas 10.7 Varzea Tail Diagnostic

on:
  push:
    branches:
      - projeto-jornada-snapshots
  workflow_dispatch:

concurrency:
  group: veredas-107-varzea-tail-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild integrated fixture
        working-directory: projeto_jornada
        run: |
          python tools/rebuild_content.py
          python tools/refine_npc_authenticity.py
          python tools/refine_character_balance.py
          python tools/enforce_character_horizontal_budget.py
          python tools/refine_enemy_balance.py
          python tools/refine_item_economy.py
          python tools/refine_narrative_balance.py
      - name: Patch candidate attrition locally
        working-directory: projeto_jornada
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('core/systems/JourneySimulationEngine.gd'); s=p.read_text()
          old='''    flags["simulation.build"] = build_id\n    flags["simulation.disable_item_economy"] = not bool(config.get("economy_enabled", true))\n    GameState.run.flags = flags\n'''
          new='''    flags["simulation.build"] = build_id\n    flags["simulation.disable_item_economy"] = not bool(config.get("economy_enabled", true))\n    flags["simulation.no_attrition"] = not bool(config.get("attrition_enabled", true))\n    GameState.run.flags = flags\n'''
          if s.count(old)!=1: raise SystemExit('simulation anchor mismatch')
          p.write_text(s.replace(old,new))

          p=Path('core/systems/LocationEngine.gd'); s=p.read_text()
          old='''    if world_id != str(GameState.run.get("world_id", "")):\n        return false\n    GameState.run.location_id = location_id\n'''
          new='''    if world_id != str(GameState.run.get("world_id", "")):\n        return false\n    if location_id != str(GameState.run.get("location_id", "")):\n        _apply_travel_attrition()\n    GameState.run.location_id = location_id\n'''
          if s.count(old)!=1: raise SystemExit('travel_to anchor mismatch')
          s=s.replace(old,new)
          old='''    if target not in locations:\n        return false\n    GameState.run.world_id = world_id\n'''
          new='''    if target not in locations:\n        return false\n    if world_id != str(GameState.run.get("world_id", "")) or target != str(GameState.run.get("location_id", "")):\n        _apply_travel_attrition()\n    GameState.run.world_id = world_id\n'''
          if s.count(old)!=1: raise SystemExit('travel_world anchor mismatch')
          s=s.replace(old,new)
          anchor='''func _remember(location_id: String) -> void:\n'''
          helper='''func _apply_travel_attrition() -> void:\n    var flags: Dictionary = GameState.run.get("flags", {}) as Dictionary\n    if bool(flags.get("simulation.no_attrition", false)):\n        return\n    var resources: Dictionary = GameState.run.get("resources", {}) as Dictionary\n    var provisions := maxi(0, int(resources.get("provisions", 0)))\n    if provisions > 0:\n        resources.provisions = provisions - 1\n        GameState.run.resources = resources\n        return\n    var vigor := maxi(0, int(GameState.run.get("vigor", 0)))\n    if vigor > 0:\n        GameState.run.vigor = vigor - 1\n        return\n    GameState.run.health = maxi(1, int(GameState.run.get("health", 1)) - 1)\n\n'''
          if s.count(anchor)!=1: raise SystemExit('helper anchor mismatch')
          p.write_text(s.replace(anchor,helper+anchor))
          PY
      - name: Create diagnostic scene locally
        working-directory: projeto_jornada
        run: |
          cat > tests/VarzeaTailDiagnostic.gd <<'GD'
          extends Node
          var simulator := DifficultySimulationEngine.new()
          func _ready() -> void:
              await get_tree().process_frame
              var found := 0
              var characters: Array = []
              for row_variant in ContentRegistry.all("characters"):
                  var row: Dictionary = row_variant as Dictionary
                  if str(row.get("world_id", "")) == "world.varzea_espelhos":
                      characters.append(row)
              for character_index in range(characters.size()):
                  var character: Dictionary = characters[character_index] as Dictionary
                  var curve: Dictionary = character.get("learning_curve", {}) as Dictionary
                  var policy := str(curve.get("recommended_policy", "balanced"))
                  for sample_index in range(12):
                      var seed_value := 107000 + (30 + character_index) * 1009 + sample_index * 97
                      for difficulty_id in DifficultyEngine.ids():
                          var result := simulator.simulate({"character_id":str(character.id),"policy_id":policy,"build_id":"baseline","seed":seed_value,"max_steps":80}, difficulty_id)
                          if int(result.get("steps",0)) > 30 or int(result.get("boss_step",0)) > 30:
                              found += 1
                              print("10.7 TAIL name=%s policy=%s difficulty=%s seed=%d result=%s steps=%d boss_reached=%s boss_step=%d hp_start/min/final=%d/%d/%d vigor_start/min/final=%d/%d/%d provisions_start/final/spent=%d/%d/%d events=%d combats=%d travel=%d locations=%d" % [str(character.name),policy,difficulty_id,seed_value,str(result.get("result","")),int(result.get("steps",0)),str(result.get("boss_reached",false)),int(result.get("boss_step",0)),int(result.get("start_health",0)),int(result.get("min_health",0)),int(result.get("final_health",0)),int(result.get("start_vigor",0)),int(result.get("min_vigor",0)),int(result.get("final_vigor",0)),int(result.get("start_provisions",0)),int(result.get("final_provisions",0)),int(result.get("provisions_spent",0)),int(result.get("events",0)),int(result.get("combats",0)),int(result.get("travel_actions",0)),int(result.get("locations_visited",0))])
              print("10.7 VARZEA_TAIL_DIAGNOSTIC found=%d" % found)
              get_tree().quit(0)
          GD
          cat > tests/varzea_tail_diagnostic.tscn <<'TSCN'
          [gd_scene load_steps=2 format=3]
          [ext_resource path="res://tests/VarzeaTailDiagnostic.gd" type="Script" id="1"]
          [node name="VarzeaTailDiagnostic" type="Node"]
          script = ExtResource("1")
          TSCN
      - name: Download Godot
        run: |
          curl -fL 'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7.1' -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path projeto_jornada --editor --quit
      - name: Diagnose long tail
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path projeto_jornada res://tests/varzea_tail_diagnostic.tscn
