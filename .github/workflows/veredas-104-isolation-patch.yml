name: Veredas 10.4 Phase Isolation Patch
# Exact literal trigger for phase-isolation patch.

on:
  push:
    branches:
      - projeto-jornada-snapshots
    paths:
      - '.github/workflows/veredas-104-isolation-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: projeto-jornada-snapshots
          fetch-depth: 0
      - name: Isolate Phase 10.2 from Phase 10.4 economy
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('projeto_jornada/core/systems/JourneySimulationEngine.gd')
          s = p.read_text(encoding='utf-8')
          old = '    flags["simulation.policy"] = policy_id\n    flags["simulation.build"] = build_id\n    GameState.run.flags = flags'
          new = '    flags["simulation.policy"] = policy_id\n    flags["simulation.build"] = build_id\n    flags["simulation.disable_item_economy"] = not bool(config.get("economy_enabled", true))\n    GameState.run.flags = flags'
          if s.count(old) != 1:
              raise SystemExit(f'JourneySimulation flag target mismatch: {s.count(old)}')
          s = s.replace(old, new, 1)
          old = 'func _equip_loot_upgrades(policy_id: String) -> void:\n    var seen: Dictionary = {}'
          new = 'func _equip_loot_upgrades(policy_id: String) -> void:\n    if bool((GameState.run.get("flags", {}) as Dictionary).get("simulation.disable_item_economy", false)):\n        return\n    var seen: Dictionary = {}'
          if s.count(old) != 1:
              raise SystemExit(f'JourneySimulation loot target mismatch: {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          p = Path('projeto_jornada/tests/CharacterBalanceCertification.gd')
          s = p.read_text(encoding='utf-8')
          old = '                    "build_id":"baseline",\n                    "seed":seed_value,'
          new = '                    "build_id":"baseline",\n                    "economy_enabled":false,\n                    "seed":seed_value,'
          if s.count(old) != 1:
              raise SystemExit(f'CharacterBalance config target mismatch: {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          git diff -- projeto_jornada/core/systems/JourneySimulationEngine.gd projeto_jornada/tests/CharacterBalanceCertification.gd
      - name: Commit phase isolation
        run: |
          git config user.name 'Veredas CI'
          git config user.email 'actions@users.noreply.github.com'
          git add projeto_jornada/core/systems/JourneySimulationEngine.gd projeto_jornada/tests/CharacterBalanceCertification.gd
          git commit -m 'Isolate character certification from item economy'
          git push origin HEAD:projeto-jornada-snapshots
