name: Veredas Repair Authored RunFlow Bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/veredas-repair-authored-runflow.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Restore authored debrief bridge fail-closed
        shell: python
        run: |
          from pathlib import Path
          p = Path('projeto_jornada/core/systems/RunFlowEngine.gd')
          s = p.read_text(encoding='utf-8')

          required_existing = [
              'AuthoredStoryDirector.activate_for_new_run()',
              'AuthoredStoryDirector.current_event()',
              'AuthoredStoryDirector.is_authored_event(event)',
          ]
          for marker in required_existing:
              if s.count(marker) != 1:
                  raise SystemExit(f'expected existing authored bridge exactly once: {marker}: {s.count(marker)}')

          old = '''func debrief() -> Dictionary:\n    return {\n        "result": GameState.run.get("result", "in_progress"),\n        "ending_id": GameState.run.get("ending_id", ""),\n        "turns": int(GameState.run.get("turn", 0)),\n        "visited_locations": GameState.run.get("visited_locations", []).duplicate(),\n        "defeated_enemies": GameState.run.get("defeated_enemies", []).duplicate(),\n        "purchases": GameState.run.get("purchases", []).duplicate(),\n        "loot_found": GameState.run.get("loot_found", []).duplicate(),\n        "marks": GameState.run.get("marks", {}).duplicate(true),\n        "echoes": EchoConsequenceEngine.summary(),\n    }\n'''
          new = '''func debrief() -> Dictionary:\n    var report := {\n        "result": GameState.run.get("result", "in_progress"),\n        "ending_id": GameState.run.get("ending_id", ""),\n        "turns": int(GameState.run.get("turn", 0)),\n        "visited_locations": GameState.run.get("visited_locations", []).duplicate(),\n        "defeated_enemies": GameState.run.get("defeated_enemies", []).duplicate(),\n        "purchases": GameState.run.get("purchases", []).duplicate(),\n        "loot_found": GameState.run.get("loot_found", []).duplicate(),\n        "marks": GameState.run.get("marks", {}).duplicate(true),\n        "echoes": EchoConsequenceEngine.summary(),\n    }\n    var authored := AuthoredStoryDirector.debrief()\n    if not authored.is_empty():\n        report["authored_debrief"] = authored\n    return report\n'''
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one legacy debrief block, found {s.count(old)}')
          s = s.replace(old, new)
          if s.count('report["authored_debrief"] = authored') != 1:
              raise SystemExit('authored debrief bridge not established exactly once')
          p.write_text(s, encoding='utf-8')
      - name: Commit repaired bridge
        shell: bash
        run: |
          set -euo pipefail
          git diff --check -- projeto_jornada/core/systems/RunFlowEngine.gd
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add projeto_jornada/core/systems/RunFlowEngine.gd
          git commit -m 'fix: restore authored debrief into RunFlow report'
          git push origin HEAD:main
