name: Veredas Repair Authored RunFlow Bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/veredas-repair-authored-runflow.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Restore authored RunFlow integration fail-closed
        shell: python
        run: |
          from pathlib import Path
          p = Path('projeto_jornada/core/systems/RunFlowEngine.gd')
          s = p.read_text(encoding='utf-8')

          patches = []
          patches.append((
          '''        EchoConsequenceEngine.apply_to_run()\n    return true\n''',
          '''        EchoConsequenceEngine.apply_to_run()\n        AuthoredStoryDirector.activate_for_new_run()\n    return true\n'''))

          patches.append((
          '''func story_event() -> Dictionary:\n    GameState.run.mode = "story"\n    var event: Dictionary = EventDirector.choose_event(str(GameState.run.get("world_id", "")), str(GameState.run.get("location_id", "")))\n    if not event.is_empty() and not _simulation_no_persist():\n        MetaUnlockEngine.discover(str(event.get("id", "")))\n    return event\n''',
          '''func story_event() -> Dictionary:\n    GameState.run.mode = "story"\n    var event: Dictionary = AuthoredStoryDirector.current_event()\n    if not event.is_empty():\n        return event\n    event = EventDirector.choose_event(str(GameState.run.get("world_id", "")), str(GameState.run.get("location_id", "")))\n    if not event.is_empty() and not _simulation_no_persist():\n        MetaUnlockEngine.discover(str(event.get("id", "")))\n    return event\n'''))

          patches.append((
          '''func choose(event: Dictionary, option: int) -> bool:\n    var choices: Array = event.get("choices", [])\n    if option < 0 or option >= choices.size():\n        return false\n    if not _simulation_no_persist():\n        MetaUnlockEngine.discover(str(event.get("id", "")))\n    return EventDirector.apply_choice(event, option)\n''',
          '''func choose(event: Dictionary, option: int) -> bool:\n    var choices: Array = event.get("choices", [])\n    if option < 0 or option >= choices.size():\n        return false\n    if AuthoredStoryDirector.is_authored_event(event):\n        return AuthoredStoryDirector.apply_choice(event, option)\n    if not _simulation_no_persist():\n        MetaUnlockEngine.discover(str(event.get("id", "")))\n    return EventDirector.apply_choice(event, option)\n'''))

          patches.append((
          '''func debrief() -> Dictionary:\n    return {\n        "result": GameState.run.get("result", "in_progress"),\n        "ending_id": GameState.run.get("ending_id", ""),\n        "turns": int(GameState.run.get("turn", 0)),\n        "visited_locations": GameState.run.get("visited_locations", []).duplicate(),\n        "defeated_enemies": GameState.run.get("defeated_enemies", []).duplicate(),\n        "purchases": GameState.run.get("purchases", []).duplicate(),\n        "loot_found": GameState.run.get("loot_found", []).duplicate(),\n        "marks": GameState.run.get("marks", {}).duplicate(true),\n        "echoes": EchoConsequenceEngine.summary(),\n    }\n''',
          '''func debrief() -> Dictionary:\n    var report := {\n        "result": GameState.run.get("result", "in_progress"),\n        "ending_id": GameState.run.get("ending_id", ""),\n        "turns": int(GameState.run.get("turn", 0)),\n        "visited_locations": GameState.run.get("visited_locations", []).duplicate(),\n        "defeated_enemies": GameState.run.get("defeated_enemies", []).duplicate(),\n        "purchases": GameState.run.get("purchases", []).duplicate(),\n        "loot_found": GameState.run.get("loot_found", []).duplicate(),\n        "marks": GameState.run.get("marks", {}).duplicate(true),\n        "echoes": EchoConsequenceEngine.summary(),\n    }\n    var authored := AuthoredStoryDirector.debrief()\n    if not authored.is_empty():\n        report["authored_debrief"] = authored\n    return report\n'''))

          for old, new in patches:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one old RunFlow block; found {count}')
              s = s.replace(old, new)

          required = [
              'AuthoredStoryDirector.activate_for_new_run()',
              'AuthoredStoryDirector.current_event()',
              'AuthoredStoryDirector.is_authored_event(event)',
              'report["authored_debrief"] = authored',
          ]
          for marker in required:
              if s.count(marker) != 1:
                  raise SystemExit(f'RunFlow marker count mismatch: {marker}: {s.count(marker)}')
          p.write_text(s, encoding='utf-8')
      - name: Commit repaired bridge
        shell: bash
        run: |
          set -euo pipefail
          git diff --check -- projeto_jornada/core/systems/RunFlowEngine.gd
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add projeto_jornada/core/systems/RunFlowEngine.gd
          git commit -m 'fix: restore authored story RunFlow bridge'
          git push origin HEAD:main
