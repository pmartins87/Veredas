name: Veredas da Trama Android Build

on:
  push:
    branches:
      - projeto-jornada-snapshots
    paths:
      - 'projeto_jornada/project.godot'
      - 'projeto_jornada/export_presets.cfg'
      - 'projeto_jornada/mobile/**'
      - 'projeto_jornada/.android-build-trigger'
      - '.github/workflows/veredas-android.yml'
  workflow_dispatch:

concurrency:
  group: veredas-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Rebuild and validate canonical project
        working-directory: projeto_jornada
        run: |
          python tools/rebuild_content.py
          python tools/refine_npc_authenticity.py
          python tools/validate_canonical.py
          python tools/prepare_mobile_assets.py
          python tools/audit_mobile_assets.py
          python tools/validate_android_export.py

      - name: Download Godot 4.7.1 stable
        run: |
          curl -fL 'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7.1' -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          echo '/tmp/godot' >> "$GITHUB_PATH"

      - name: Cache Godot export templates
        id: export-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/4.7.1.stable
          key: godot-4.7.1-stable-export-templates-v1

      - name: Install Godot export templates
        if: steps.export-cache.outputs.cache-hit != 'true'
        run: |
          curl -fL 'https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz' -o /tmp/templates.tpz
          rm -rf /tmp/godot-templates
          mkdir -p /tmp/godot-templates "$HOME/.local/share/godot/export_templates/4.7.1.stable"
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          if [ -d /tmp/godot-templates/templates ]; then
            cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.1.stable/"
          else
            cp -a /tmp/godot-templates/. "$HOME/.local/share/godot/export_templates/4.7.1.stable/"
          fi
          test -f "$HOME/.local/share/godot/export_templates/4.7.1.stable/android_debug.apk"

      - name: Configure Godot Android editor settings
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.config/godot" "${HOME}/.android" build/android-diagnostics
          if [ ! -f "${HOME}/.android/debug.keystore" ]; then
            keytool -keyalg RSA -genkeypair -v \
              -keystore "${HOME}/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -dname 'CN=Android Debug,O=Veredas da Trama,C=BR' \
              -validity 10000
          fi
          EDITOR_SETTINGS="${HOME}/.config/godot/editor_settings-4.7.tres"
          printf '%s\n' \
            '[gd_resource type="EditorSettings" format=3]' \
            '' \
            '[resource]' \
            "export/android/android_sdk_path = \"${ANDROID_HOME}\"" \
            "export/android/java_sdk_path = \"${JAVA_HOME}\"" \
            "export/android/debug_keystore = \"${HOME}/.android/debug.keystore\"" \
            'export/android/debug_keystore_user = "androiddebugkey"' \
            'export/android/debug_keystore_pass = "android"' \
            > "$EDITOR_SETTINGS"
          cp "$EDITOR_SETTINGS" build/android-diagnostics/editor_settings-4.7.tres
          env | sort | grep -E '^(ANDROID|JAVA_HOME|HOME)=' > build/android-diagnostics/environment.txt || true
          find "$HOME/.local/share/godot/export_templates/4.7.1.stable" -maxdepth 1 -type f -printf '%f %s bytes\n' | sort > build/android-diagnostics/export-templates.txt
          "$ANDROID_HOME/platform-tools/adb" version > build/android-diagnostics/adb-version.txt 2>&1
          java -version 2> build/android-diagnostics/java-version.txt
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --version > build/android-diagnostics/godot-version.txt

      - name: Import project
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path projeto_jornada --editor --quit 2>&1 | tee build/android-diagnostics/import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' build/android-diagnostics/import.log; then
            exit 1
          fi

      - name: Export debug APK
        id: export_apk
        shell: bash
        run: |
          mkdir -p build/android build/android-diagnostics
          set +e
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --verbose --path projeto_jornada \
            --export-debug 'Android Debug APK' "$GITHUB_WORKSPACE/build/android/veredas-debug.apk" \
            > build/android-diagnostics/export.log 2>&1
          STATUS=$?
          set -e
          cat build/android-diagnostics/export.log
          printf '%s\n' "$STATUS" > build/android-diagnostics/export-exit-code.txt
          find build/android -maxdepth 2 -type f -printf '%p %s bytes\n' | sort > build/android-diagnostics/output-files.txt || true
          test "$STATUS" -eq 0 || exit "$STATUS"
          test -s build/android/veredas-debug.apk
          if grep -E 'SCRIPT ERROR|Parse Error|Export failed' build/android-diagnostics/export.log; then
            exit 1
          fi
          sha256sum build/android/veredas-debug.apk | tee build/android/veredas-debug.apk.sha256
          du -h build/android/veredas-debug.apk

      - name: Upload Android diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veredas-android-export-diagnostics
          path: build/android-diagnostics/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: veredas-debug-apk
          path: |
            build/android/veredas-debug.apk
            build/android/veredas-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14

  emulator-certification:
    name: emulator-api-${{ matrix.api-level }}
    needs: android-debug-apk
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 29
            label: android10
          - api-level: 34
            label: android14
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Prepare emulator runtime and KVM
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libpulse0
          ldconfig -p | grep 'libpulse.so.0'
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            test -r /dev/kvm
            test -w /dev/kvm
            ls -l /dev/kvm
          else
            echo '/dev/kvm is not exposed on this runner.'
            exit 1
          fi

      - name: Download exact APK built by this workflow
        uses: actions/download-artifact@v4
        with:
          name: veredas-debug-apk
          path: android-artifact

      - name: Resolve APK
        id: apk
        run: |
          set -euo pipefail
          APK=$(find android-artifact -type f -name '*.apk' -print -quit)
          test -n "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - name: Android ${{ matrix.api-level }} install-launch-resume certification
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -no-metrics -gpu swiftshader_indirect
          script: |
            set -euo pipefail
            PACKAGE='com.veredasdatrama.preview'
            APK='${{ steps.apk.outputs.path }}'
            adb install -r "$APK"
            adb shell pm path "$PACKAGE"
            adb logcat -c
            adb shell monkey -p "$PACKAGE" -c android.intent.category.LAUNCHER 1
            sleep 6
            PID=$(adb shell pidof "$PACKAGE" | tr -d '\r')
            test -n "$PID"
            adb shell input keyevent KEYCODE_HOME
            sleep 3
            adb shell run-as "$PACKAGE" sh -c 'test -s files/veredas_save.json'
            adb exec-out run-as "$PACKAGE" cat files/veredas_save.json > /tmp/veredas-save-before.json
            python - <<'PY'
            import json
            data=json.load(open('/tmp/veredas-save-before.json',encoding='utf-8'))
            run=data['game']['run']
            assert run['active'] is True
            assert int(run['seed']) > 0
            print('SAVE_BEFORE seed=',run['seed'],'world=',run['world_id'])
            PY
            SEED_BEFORE=$(python -c "import json; print(json.load(open('/tmp/veredas-save-before.json'))['game']['run']['seed'])")
            adb shell am force-stop "$PACKAGE"
            sleep 2
            adb shell monkey -p "$PACKAGE" -c android.intent.category.LAUNCHER 1
            sleep 6
            PID=$(adb shell pidof "$PACKAGE" | tr -d '\r')
            test -n "$PID"
            adb shell input keyevent KEYCODE_HOME
            sleep 3
            adb exec-out run-as "$PACKAGE" cat files/veredas_save.json > /tmp/veredas-save-after.json
            SEED_AFTER=$(python -c "import json; print(json.load(open('/tmp/veredas-save-after.json'))['game']['run']['seed'])")
            test "$SEED_BEFORE" = "$SEED_AFTER"
            if adb logcat -d | grep -E 'SCRIPT ERROR|Parse Error|FATAL EXCEPTION.*com\.veredasdatrama\.preview'; then
              echo 'Runtime error found in Android logcat'
              exit 1
            fi
            echo "ANDROID_EMULATOR_CERTIFICATION PASS: API ${{ matrix.api-level }} seed $SEED_AFTER"

      - name: Upload compatibility evidence
        run: |
          mkdir -p compatibility
          printf '%s\n' \
            'api_level=${{ matrix.api-level }}' \
            'label=${{ matrix.label }}' \
            'architecture=x86_64' \
            'install=pass' \
            'launch=pass' \
            'pause_autosave=pass' \
            'force_stop_relaunch=pass' \
            'seed_persistence=pass' \
            > compatibility/${{ matrix.label }}.txt

      - uses: actions/upload-artifact@v4
        with:
          name: veredas-${{ matrix.label }}-compatibility
          path: compatibility/${{ matrix.label }}.txt
          retention-days: 14
