name: Veredas da Trama Android Build

on:
  push:
    branches:
      - projeto-jornada-snapshots
    paths:
      - 'projeto_jornada/**'
      - '.github/workflows/veredas-android.yml'
  workflow_dispatch:

jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Rebuild and validate canonical project
        working-directory: projeto_jornada
        run: |
          python tools/rebuild_content.py
          python tools/refine_npc_authenticity.py
          python tools/validate_canonical.py
          python tools/prepare_mobile_assets.py
          python tools/audit_mobile_assets.py
          python tools/validate_android_export.py

      - name: Download Godot 4.7.1 stable
        run: |
          curl -fL 'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7.1' -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          echo '/tmp/godot' >> "$GITHUB_PATH"

      - name: Cache Godot export templates
        id: export-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/4.7.1.stable
          key: godot-4.7.1-stable-export-templates-v1

      - name: Install Godot export templates
        if: steps.export-cache.outputs.cache-hit != 'true'
        run: |
          curl -fL 'https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz' -o /tmp/templates.tpz
          rm -rf /tmp/godot-templates
          mkdir -p /tmp/godot-templates "$HOME/.local/share/godot/export_templates/4.7.1.stable"
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          if [ -d /tmp/godot-templates/templates ]; then
            cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.1.stable/"
          else
            cp -a /tmp/godot-templates/. "$HOME/.local/share/godot/export_templates/4.7.1.stable/"
          fi
          test -f "$HOME/.local/share/godot/export_templates/4.7.1.stable/android_debug.apk"

      - name: Configure Godot Android editor settings
        run: |
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -keyalg RSA -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -dname 'CN=Android Debug,O=Veredas da Trama,C=BR' \
              -validity 10000
          fi
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          test -x "$ANDROID_HOME/platform-tools/adb"
          java -version
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --version

      - name: Import project
        run: |
          set -o pipefail
          output=$(/tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path projeto_jornada --editor --quit 2>&1)
          printf '%s\n' "$output"
          if printf '%s\n' "$output" | grep -E 'SCRIPT ERROR|Parse Error|Failed to load script'; then
            exit 1
          fi

      - name: Export debug APK
        run: |
          mkdir -p build/android
          set -o pipefail
          output=$(/tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path projeto_jornada --export-debug 'Android Debug APK' "$GITHUB_WORKSPACE/build/android/veredas-debug.apk" 2>&1)
          printf '%s\n' "$output"
          if printf '%s\n' "$output" | grep -E 'ERROR:|SCRIPT ERROR|Parse Error|Export failed'; then
            exit 1
          fi
          test -s build/android/veredas-debug.apk
          sha256sum build/android/veredas-debug.apk | tee build/android/veredas-debug.apk.sha256
          du -h build/android/veredas-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: veredas-debug-apk
          path: |
            build/android/veredas-debug.apk
            build/android/veredas-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
