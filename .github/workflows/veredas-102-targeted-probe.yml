name: Veredas 10.2 Targeted Probe

on:
  push:
    branches:
      - projeto-jornada-snapshots
  workflow_dispatch:

concurrency:
  group: veredas-102-targeted-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download Godot
        run: |
          curl -fsSL 'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7.1' -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project once
        run: timeout 30s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path projeto_jornada --editor --quit
      - name: Probe Guardiao policies and Forja corrections
        working-directory: projeto_jornada
        run: |
          set -euo pipefail
          rebuild() {
            python tools/rebuild_content.py >/dev/null
            python tools/refine_npc_authenticity.py >/dev/null
            python tools/refine_character_balance.py >/dev/null
            python tools/enforce_character_horizontal_budget.py >/dev/null
            python tools/refine_enemy_balance.py >/dev/null
            python tools/refine_item_economy.py >/dev/null
          }
          run_gate() {
            set +e
            output=$(timeout 20s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path . res://tests/character_balance_certification.tscn 2>&1)
            code=$?
            set -e
            printf '%s\n' "$output" | grep -E '10\.2 character (Guardião de Casca|Ferreiro de Guerra|Desertor da Forja|Tecelã de Metal|Sonhador de Gelo)|world\.forja_rubra|recommended play fails|CHARACTER_BALANCE_CERTIFICATION (PASS|FAIL)' || true
            echo "exit=$code"
          }

          for policy in balanced aggressive cautious explorer; do
            echo "=== GUARDIAO policy=$policy ==="
            rebuild
            POLICY="$policy" python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('data/characters.json'); rows=json.loads(p.read_text())
          for r in rows:
              if r.get('name')=='Guardião de Casca':
                  r['learning_curve']['recommended_policy']=os.environ['POLICY']
          p.write_text(json.dumps(rows, ensure_ascii=False, indent=2))
          PY
            run_gate
          done

          echo '=== FORJA tecela_guard_2 + sonhador_balanced ==='
          rebuild
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/characters.json'); rows=json.loads(p.read_text())
          for r in rows:
              if r.get('name')=='Tecelã de Metal': r['base_guard']=2
              if r.get('name')=='Sonhador de Gelo': r['learning_curve']['recommended_policy']='balanced'
          p.write_text(json.dumps(rows, ensure_ascii=False, indent=2))
          PY
          run_gate

          echo '=== FORJA desertor_counter_3 + sonhador_balanced ==='
          rebuild
          python - <<'PY'
          import json
          from pathlib import Path
          cp=Path('data/characters.json'); ap=Path('data/abilities.json')
          chars=json.loads(cp.read_text()); abilities=json.loads(ap.read_text()); byid={a['id']:a for a in abilities}
          for r in chars:
              if r.get('name')=='Sonhador de Gelo': r['learning_curve']['recommended_policy']='balanced'
              if r.get('name')=='Desertor da Forja':
                  for aid in r.get('abilities',[]):
                      if byid[aid].get('mechanic')=='counter': byid[aid]['power']=3
          cp.write_text(json.dumps(chars, ensure_ascii=False, indent=2)); ap.write_text(json.dumps(abilities, ensure_ascii=False, indent=2))
          PY
          run_gate
