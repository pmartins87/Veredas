name: Veredas 10.2 Targeted Probe

on:
  push:
    branches:
      - projeto-jornada-snapshots
  workflow_dispatch:

concurrency:
  group: veredas-102-targeted-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download Godot
        run: |
          curl -fsSL 'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7.1' -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project once
        run: timeout 30s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path projeto_jornada --editor --quit
      - name: Probe setup fallback and Guardian counter
        working-directory: projeto_jornada
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('core/systems/PlayerPolicyEngine.gd')
          s=p.read_text()
          old='''    if not balanced_progress_ability.is_empty():\n        return {"kind":"ability", "id":str(balanced_progress_ability.get("id", ""))}\n    if not echo_ability.is_empty() and guard_value <= 0 and enemy_hp_ratio >= 0.50:\n'''
          new='''    if not balanced_progress_ability.is_empty():\n        return {"kind":"ability", "id":str(balanced_progress_ability.get("id", ""))}\n    if _setup_is_worthwhile(setup_ability, enemy, enemy_hp_ratio):\n        return {"kind":"ability", "id":str(setup_ability.get("id", ""))}\n    if not echo_ability.is_empty() and guard_value <= 0 and enemy_hp_ratio >= 0.50:\n'''
          if s.count(old)!=1: raise SystemExit('balanced fallback anchor mismatch')
          p.write_text(s.replace(old,new))
          PY

          rebuild() {
            python tools/rebuild_content.py >/dev/null
            python tools/refine_npc_authenticity.py >/dev/null
            python tools/refine_character_balance.py >/dev/null
            python tools/enforce_character_horizontal_budget.py >/dev/null
            python tools/refine_enemy_balance.py >/dev/null
            python tools/refine_item_economy.py >/dev/null
          }
          scenario() {
            local label="$1" power="$2" cost="$3" policy="$4"
            echo "=== $label ==="
            rebuild
            POWER="$power" COST="$cost" POLICY="$policy" python - <<'PY'
          import json, os
          from pathlib import Path
          cp=Path('data/characters.json'); ap=Path('data/abilities.json')
          chars=json.loads(cp.read_text()); abilities=json.loads(ap.read_text()); byid={a['id']:a for a in abilities}
          for r in chars:
              if r.get('name')=='Sonhador de Gelo':
                  r['learning_curve']['recommended_policy']='balanced'
              if r.get('name')=='Guardião de Casca':
                  r['learning_curve']['recommended_policy']=os.environ['POLICY']
                  for aid in r.get('abilities',[]):
                      a=byid[aid]
                      if a.get('mechanic')=='counter':
                          a['power']=int(os.environ['POWER']); a['cost']=int(os.environ['COST'])
          cp.write_text(json.dumps(chars, ensure_ascii=False, indent=2)); ap.write_text(json.dumps(abilities, ensure_ascii=False, indent=2))
          PY
            set +e
            output=$(timeout 20s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path . res://tests/character_balance_certification.tscn 2>&1)
            code=$?
            set -e
            printf '%s\n' "$output" | grep -E '10\.2 character (Guardião de Casca|Ferreiro de Guerra|Desertor da Forja|Tecelã de Metal|Sonhador de Gelo|Cantora de Cipós)|world\.forja_rubra|recommended play fails|CHARACTER_BALANCE_CERTIFICATION (PASS|FAIL)' || true
            echo "exit=$code"
          }

          scenario 'BASE_SETUP + Guardian cautious p3c3' 3 3 cautious
          scenario 'Guardian cautious p4c3' 4 3 cautious
          scenario 'Guardian cautious p3c2' 3 2 cautious
          scenario 'Guardian cautious p4c2' 4 2 cautious
          scenario 'Guardian explorer p4c2' 4 2 explorer
