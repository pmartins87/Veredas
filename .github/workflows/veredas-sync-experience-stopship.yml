name: Veredas Sync Experience Stop-Ship

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/veredas-sync-experience-stopship.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Correct PROJECT_STATE fail-closed
        shell: python
        run: |
          import json
          from pathlib import Path

          p = Path('projeto_jornada/PROJECT_STATE.json')
          state = json.loads(p.read_text(encoding='utf-8'))

          assert state['completed_steps'] == 112, state['completed_steps']
          assert state['current_phase'] == 11, state['current_phase']
          assert state['phase11']['11.3'] == 'in_progress_physical_device_required'
          assert state['phase11']['11.4'] == 'certified'
          assert state['phase11']['11.6'] == 'certified'
          assert state['phase11']['11.8'] == 'certified'
          assert state['phase11']['11.9'] == 'certified'

          state['completed_steps'] = 107
          state['current_phase'] = 6
          state['current_step'] = '6.1'
          state['current_step_title'] = 'Reautoria da Golden Vertical Slice da Mata do Fio Verde'

          state['phase11']['11.3'] = 'in_progress_suspended_until_EXP-001_resolved'
          state['phase11']['11.4'] = 'in_progress_reopened_by_physical_playtest'
          state['phase11']['11.6'] = 'in_progress_reopened_semantic_and_source_locale_quality'
          state['phase11']['11.8'] = 'in_progress_active_blocker_EXP-001'

          state['phase11_in_progress']['11.3'] = {
              'physical_device': 'suspended_until_EXP-001_resolved',
              'minimum_soak_seconds': 1800,
              'resume_only_on_new_representative_candidate': True,
          }
          state['phase11_in_progress']['11.4'] = {
              'status': 'reopened_by_physical_playtest',
              'reason': 'automated responsive geometry did not prove acceptable real-device presentation or accessibility context',
          }
          state['phase11_in_progress']['11.6'] = {
              'status': 'reopened_by_physical_playtest',
              'reason': 'PT-BR leaked internal/English labels and structural coverage did not prove semantic/dramatic coherence',
          }
          state['phase11_in_progress']['11.8'] = {
              'status': 'blocked',
              'active_blocker': 'EXP-001',
          }

          for key in ('11.4', '11.6', '11.8'):
              if key in state.get('phase11_certified_evidence', {}):
                  row = state['phase11_certified_evidence'][key]
                  if isinstance(row, dict):
                      row['superseded_by'] = 'EXP-001'
                      row['evidence_class'] = 'historical_technical_pass_not_current_product_acceptance'

          state['product_experience_stop_ship'] = {
              'active': True,
              'blocker_id': 'EXP-001',
              'detected_on': '2026-08-14',
              'trigger': 'first_human_physical_android_playtest',
              'formal_count_before': 112,
              'formal_count_after': 107,
              'invalidated_steps': ['6.1', '6.10', '11.4', '11.6', '11.8'],
              'release_work_suspended': True,
              'physical_soak_suspended': True,
              'current_build_classification': 'technical_harness_not_representative_game_build',
              'recovery_plan': 'PRODUCT_EXPERIENCE_RECOVERY.md',
              'next_product_gate': 'authored_audiovisual_Mata_do_Fio_Verde_vertical_slice_human_acceptance',
          }

          p.write_text(json.dumps(state, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
      - name: Verify canonical roadmap consistency
        id: verify
        shell: bash
        run: |
          set +e
          python projeto_jornada/tools/roadmap_state_consistency.py > state-consistency.txt 2>&1
          code=$?
          cat state-consistency.txt
          git diff --check -- projeto_jornada/PROJECT_STATE.json >> state-consistency.txt 2>&1
          diff_code=$?
          if [ "$code" -ne 0 ] || [ "$diff_code" -ne 0 ]; then
            exit 1
          fi
      - name: Upload consistency diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experience-stopship-consistency
          path: state-consistency.txt
          if-no-files-found: error
          retention-days: 2
      - name: Commit corrected state
        if: steps.verify.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add projeto_jornada/PROJECT_STATE.json
          git commit -m 'roadmap: sync 107/130 experience stop-ship state'
          git push origin HEAD:main
