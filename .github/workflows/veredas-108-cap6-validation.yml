name: Veredas 10.8 Guard Cap 6 Validation

on:
  push:
    branches:
      - projeto-jornada-snapshots
  workflow_dispatch:

concurrency:
  group: veredas-108-cap6-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild integrated fixture
        working-directory: projeto_jornada
        run: |
          python tools/rebuild_content.py >/dev/null
          python tools/refine_npc_authenticity.py >/dev/null
          python tools/refine_character_balance.py >/dev/null
          python tools/enforce_character_horizontal_budget.py >/dev/null
          python tools/refine_enemy_balance.py >/dev/null
          python tools/refine_item_economy.py >/dev/null
          python tools/refine_narrative_balance.py >/dev/null
          python tools/validate_canonical.py >/dev/null
      - name: Apply candidate equipment guard cap locally
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('projeto_jornada/core/systems/CombatEngine.gd')
          s=p.read_text(encoding='utf-8')
          old='"guard":base_guard + int(bonuses.get("guard",0)),"distance":1,"states":[],'
          new='"guard":mini(BASIC_GUARD_CAP, base_guard + int(bonuses.get("guard",0))),"distance":1,"states":[],'
          if s.count(old)!=1: raise SystemExit(f'guard anchor mismatch: {s.count(old)}')
          p.write_text(s.replace(old,new), encoding='utf-8')
          PY
      - name: Download Godot
        run: |
          curl -fsSL 'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7.1' -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import
        run: |
          set -o pipefail
          output=$(/tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path projeto_jornada --editor --quit 2>&1)
          if printf '%s\n' "$output" | grep -E 'SCRIPT ERROR|Parse Error|Failed to load script'; then printf '%s\n' "$output"; exit 1; fi
      - name: Re-certify 10.4
        run: |
          bash projeto_jornada/tools/run_godot_gate.sh /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 res://tests/item_economy_certification.tscn 'ITEM_ECONOMY_CERTIFICATION FAIL' 'ITEM_ECONOMY_CERTIFICATION PASS: 10.4'
      - name: Re-certify 10.6
        run: |
          bash projeto_jornada/tools/run_godot_gate.sh /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 res://tests/difficulty_balance_certification.tscn 'DIFFICULTY_BALANCE_CERTIFICATION FAIL' 'DIFFICULTY_BALANCE_CERTIFICATION PASS: 10.6'
      - name: Re-certify 10.7
        run: |
          bash projeto_jornada/tools/run_godot_gate.sh /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 res://tests/journey_pacing_certification.tscn 'JOURNEY_PACING_CERTIFICATION FAIL' 'JOURNEY_PACING_CERTIFICATION PASS: 10.7'
      - name: Re-run 17,280 journey mass matrix
        run: |
          set -o pipefail
          output=$(/tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path projeto_jornada res://tests/mass_simulation_probe.tscn 2>&1)
          printf '%s\n' "$output" | grep -E '^10\.8 massive|^10\.8 policy dominance|^10\.8 build dominance|^10\.8 build ruptura|^10\.8 regret|^10\.8 world |^10\.8 combo TOP|^MASS_SIMULATION_PROBE' || true
          if printf '%s\n' "$output" | grep -E 'SCRIPT ERROR|Parse Error|MASS_SIMULATION_PROBE FAIL'; then exit 1; fi
          printf '%s\n' "$output" | grep -q 'MASS_SIMULATION_PROBE PASS: 10.8 diagnostics'
