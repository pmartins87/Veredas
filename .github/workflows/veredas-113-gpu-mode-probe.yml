name: Veredas 11.3 GPU Mode Probe

on:
  push:
    branches:
      - projeto-jornada-snapshots
    paths:
      - '.github/workflows/veredas-113-gpu-mode-probe.yml'

permissions:
  actions: read
  contents: read

concurrency:
  group: veredas-113-gpu-mode-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  software-gpu:
    name: software-gpu-api-${{ matrix.api-level }}
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 34]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare emulator runtime and KVM
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse0
          sudo chmod 666 /dev/kvm
      - name: Download exact APK from 11.3-B source run
        uses: actions/download-artifact@v4
        with:
          name: veredas-debug-apk
          path: android-artifact
          repository: pmartins87/desktop-tutorial
          run-id: 31350079016
          github-token: ${{ github.token }}
      - name: Verify exact APK
        run: |
          test -s android-artifact/veredas-debug.apk
          sha256sum android-artifact/veredas-debug.apk
      - name: Existing Android gate plus 11.3-B using current software GPU mode
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -no-metrics -gpu software
          script: sh projeto_jornada/tools/android_emulator_certify.sh com.veredasdatrama.preview android-artifact/veredas-debug.apk '${{ matrix.api-level }}' && sh projeto_jornada/tools/android_performance_profile.sh com.veredasdatrama.preview '${{ matrix.api-level }}' emulator 60
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veredas-software-gpu-api-${{ matrix.api-level }}
          path: android-emulator-diagnostics/api-${{ matrix.api-level }}/
          if-no-files-found: warn
          retention-days: 2
