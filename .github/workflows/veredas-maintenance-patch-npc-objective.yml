name: Veredas Maintenance — Preserve NPC Objective Location

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/veredas-maintenance-patch-npc-objective.yml'

permissions:
  contents: write

concurrency:
  group: veredas-maintenance-patch-npc-objective
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact fail-closed generator patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('projeto_jornada/tools/seed_structured_narrative_localization.py')
          text = path.read_text(encoding='utf-8')
          old = '''        personal, _ = parsed
          if locale == "en":
              return f"{personal} wants to {stake_t} before the place becomes unlivable because of {threat_t}."
          return f"{personal} quiere {stake_t} antes de que el lugar se vuelva inhabitable por {threat_t}."
          '''
          new = '''        personal, source_location = parsed
          loc_t = location(source_location, locale)
          if not loc_t:
              return None
          if locale == "en":
              return f"At {loc_t}, {personal} wants to {stake_t} before the place becomes unlivable because of {threat_t}."
          return f"En {loc_t}, {personal} quiere {stake_t} antes de que el lugar se vuelva inhabitable por {threat_t}."
          '''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one NPC objective generator block, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python -m py_compile projeto_jornada/tools/seed_structured_narrative_localization.py
          git diff --check
      - name: Persist generator correction
        run: |
          git config user.name 'Veredas CI'
          git config user.email 'actions@users.noreply.github.com'
          git add projeto_jornada/tools/seed_structured_narrative_localization.py
          git diff --cached --check
          git commit -m 'i18n: preserve location in NPC objective translations'
          git push origin HEAD:main
