name: Veredas Play Billing 12.4

on:
  push:
    branches:
      - projeto-jornada-snapshots
    paths:
      - 'projeto_jornada/mobile/play_billing_contract.json'
      - 'projeto_jornada/mobile/GooglePlayBillingStoreAdapter.gd'
      - 'projeto_jornada/mobile/PlayPurchaseVerificationClient.gd'
      - 'projeto_jornada/mobile/BillingService.gd'
      - 'projeto_jornada/core/systems/PlayBillingCoordinator.gd'
      - 'projeto_jornada/core/systems/EntitlementEngine.gd'
      - 'projeto_jornada/core/systems/PurchaseReference.gd'
      - 'projeto_jornada/core/systems/CommercialPolicyEngine.gd'
      - 'projeto_jornada/product/commercial_model.json'
      - 'projeto_jornada/product/privacy_data_safety.json'
      - 'projeto_jornada/scenes/Hub.gd'
      - 'projeto_jornada/scenes/JourneySetup.gd'
      - 'projeto_jornada/ui/SupporterSeal.gd'
      - 'projeto_jornada/localization/manifest.json'
      - 'projeto_jornada/localization/ui/pt_BR.json'
      - 'projeto_jornada/localization/ui/en.json'
      - 'projeto_jornada/project.godot'
      - 'projeto_jornada/export_presets.cfg'
      - 'projeto_jornada/tests/PlayBillingCoordinatorCertification.gd'
      - 'projeto_jornada/tests/play_billing_coordinator_certification.tscn'
      - 'projeto_jornada/tests/PlayBillingCorrelationCertification.gd'
      - 'projeto_jornada/tests/play_billing_correlation_certification.tscn'
      - 'projeto_jornada/tests/PlayPurchaseVerificationClientCertification.gd'
      - 'projeto_jornada/tests/play_purchase_verification_client_certification.tscn'
      - 'projeto_jornada/tests/PurchaseReferenceCertification.gd'
      - 'projeto_jornada/tests/purchase_reference_certification.tscn'
      - 'projeto_jornada/tests/EntitlementCertification.gd'
      - 'projeto_jornada/tests/entitlement_certification.tscn'
      - 'projeto_jornada/tests/LocalizationOverflowCertification.gd'
      - 'projeto_jornada/tests/LocalizationIconographyCertification.gd'
      - 'projeto_jornada/tools/play_billing_release_gate.py'
      - 'projeto_jornada/tools/play_billing_backend_gate.py'
      - 'projeto_jornada/tools/play_billing_timeout_budget_gate.py'
      - 'projeto_jornada/tools/play_billing_local_reference_gate.py'
      - 'projeto_jornada/tools/play_billing_12_4_gate.py'
      - 'projeto_jornada/tools/privacy_data_safety_gate.py'
      - 'projeto_jornada/tools/validate_android_export.py'
      - '.github/workflows/veredas-play-billing-12-4.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: veredas-play-billing-12-4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  billing-contract-and-coordinator:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate complete pre-production Billing privacy and Android contracts
        working-directory: projeto_jornada
        run: |
          python tools/play_billing_12_4_gate.py
          python tools/privacy_data_safety_gate.py
          python tools/validate_android_export.py
          python tools/validate_canonical.py

      - name: Download Godot 4.7.1 stable
        run: |
          curl -fsSL 'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7.1' -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64

      - name: Import project headless
        run: |
          set -o pipefail
          output=$(/tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path projeto_jornada --editor --quit 2>&1)
          printf '%s\n' "$output"
          if printf '%s\n' "$output" | grep -E 'SCRIPT ERROR|Parse Error|Failed to load script'; then
            exit 1
          fi

      - name: Preserve and harden certified local entitlement semantics from 9.8
        run: |
          bash projeto_jornada/tools/run_godot_gate.sh \
            /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            res://tests/entitlement_certification.tscn \
            'ENTITLEMENT_CERTIFICATION FAIL' \
            'ENTITLEMENT_CERTIFICATION PASS: 9.8'

      - name: Certify SHA-256 local purchase references and legacy migration
        run: |
          bash projeto_jornada/tools/run_godot_gate.sh \
            /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            res://tests/purchase_reference_certification.tscn \
            'PURCHASE_REFERENCE_CERTIFICATION FAIL' \
            'PURCHASE_REFERENCE_CERTIFICATION PASS: 12.4'

      - name: Certify verified production billing coordinator logic
        run: |
          bash projeto_jornada/tools/run_godot_gate.sh \
            /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            res://tests/play_billing_coordinator_certification.tscn \
            'PLAY_BILLING_COORDINATOR_CERTIFICATION FAIL' \
            'PLAY_BILLING_COORDINATOR_CERTIFICATION PASS: 12.4'

      - name: Certify async verification request correlation races
        run: |
          bash projeto_jornada/tools/run_godot_gate.sh \
            /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            res://tests/play_billing_correlation_certification.tscn \
            'PLAY_BILLING_CORRELATION_CERTIFICATION FAIL' \
            'PLAY_BILLING_CORRELATION_CERTIFICATION PASS: 12.4'

      - name: Certify HTTPS verification transport fail-closed behavior
        run: |
          bash projeto_jornada/tools/run_godot_gate.sh \
            /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            res://tests/play_purchase_verification_client_certification.tscn \
            'PLAY_PURCHASE_VERIFICATION_CLIENT_CERTIFICATION FAIL' \
            'PLAY_PURCHASE_VERIFICATION_CLIENT_CERTIFICATION PASS: 12.4'

      - name: Certify localized Billing surface overflow
        run: |
          bash projeto_jornada/tools/run_godot_gate.sh \
            /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            res://tests/localization_overflow_certification.tscn \
            'LOCALIZATION_OVERFLOW_CERTIFICATION FAIL' \
            'LOCALIZATION_OVERFLOW_CERTIFICATION PASS: 11.6'

      - name: Certify localized Billing control accessibility
        run: |
          bash projeto_jornada/tools/run_godot_gate.sh \
            /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            res://tests/localization_iconography_certification.tscn \
            'LOCALIZATION_ICONOGRAPHY_CERTIFICATION FAIL' \
            'LOCALIZATION_ICONOGRAPHY_CERTIFICATION PASS: 11.6'

      - name: Preserve clean tree
        run: git diff --exit-code
