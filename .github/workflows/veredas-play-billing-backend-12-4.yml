name: Veredas Play Billing Backend 12.4

on:
  push:
    branches:
      - projeto-jornada-snapshots
    paths:
      - 'projeto_jornada/backend/play_purchase_verifier/**'
      - 'projeto_jornada/mobile/play_billing_contract.json'
      - 'projeto_jornada/mobile/PlayPurchaseVerificationClient.gd'
      - 'projeto_jornada/RELEASE_12_4_STATE.json'
      - 'projeto_jornada/export_presets.cfg'
      - 'projeto_jornada/tools/play_billing_backend_gate.py'
      - 'projeto_jornada/tools/play_billing_timeout_budget_gate.py'
      - 'projeto_jornada/tools/play_billing_12_4_gate.py'
      - '.github/workflows/veredas-play-billing-backend-12-4.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: veredas-play-billing-backend-12-4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static backend and cross-layer timeout gates
        working-directory: projeto_jornada
        run: |
          python tools/play_billing_backend_gate.py
          python tools/play_billing_timeout_budget_gate.py
      - name: Compile backend sources
        working-directory: projeto_jornada/backend/play_purchase_verifier
        run: |
          python -m py_compile \
            verifier.py google_play_gateway.py firestore_repository.py purchase_record_merge.py app.py \
            tests/test_verifier.py tests/test_purchase_record_merge.py tests/test_app.py
      - name: Install pinned backend runtime dependencies
        working-directory: projeto_jornada/backend/play_purchase_verifier
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Unit-test fail-closed purchase persistence and HTTP semantics
        working-directory: projeto_jornada/backend/play_purchase_verifier
        run: python -m unittest discover -s tests -v
      - name: Preserve clean tree
        run: git diff --exit-code
