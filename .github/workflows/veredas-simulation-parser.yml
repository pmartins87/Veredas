name: Veredas Simulation Parser

on:
  push:
    branches:
      - projeto-jornada-snapshots
    paths:
      - 'projeto_jornada/core/systems/PlayerPolicyEngine.gd'
      - 'projeto_jornada/core/systems/JourneySimulationEngine.gd'
      - 'projeto_jornada/tests/SimulationParserProbe.gd'
      - 'projeto_jornada/tests/simulation_parser_probe.tscn'
      - '.github/workflows/veredas-simulation-parser.yml'
  workflow_dispatch:

jobs:
  parser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download Godot 4.7.1 stable
        run: |
          curl -fL 'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7.1' -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Probe simulation scripts in project context
        run: |
          set -o pipefail
          timeout 60s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path projeto_jornada res://tests/simulation_parser_probe.tscn 2>&1 | tee /tmp/simulation-parser.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Compile Error|SIMULATION_PARSER_PROBE .* failed' /tmp/simulation-parser.log
          grep -Fq 'SIMULATION_PARSER_PROBE PASS' /tmp/simulation-parser.log
