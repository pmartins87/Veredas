name: Veredas 10.8 Guard Cap Probe

on:
  push:
    branches:
      - projeto-jornada-snapshots
  workflow_dispatch:

concurrency:
  group: veredas-108-guard-cap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild integrated fixture
        working-directory: projeto_jornada
        run: |
          python tools/rebuild_content.py >/dev/null
          python tools/refine_npc_authenticity.py >/dev/null
          python tools/refine_character_balance.py >/dev/null
          python tools/enforce_character_horizontal_budget.py >/dev/null
          python tools/refine_enemy_balance.py >/dev/null
          python tools/refine_item_economy.py >/dev/null
          python tools/refine_narrative_balance.py >/dev/null
      - name: Download Godot
        run: |
          curl -fsSL 'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7.1' -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path projeto_jornada --editor --quit >/dev/null 2>&1
      - name: Compare current and capped guard
        run: |
          set -euo pipefail
          run_case() {
            local label="$1" cap="$2"
            git checkout -- projeto_jornada/core/systems/CombatEngine.gd
            if [ "$cap" != "none" ]; then
              CAP="$cap" python - <<'PY'
          import os
          from pathlib import Path
          p=Path('projeto_jornada/core/systems/CombatEngine.gd')
          s=p.read_text(encoding='utf-8')
          old='"guard":base_guard + int(bonuses.get("guard",0)),"distance":1,"states":[],'
          new='"guard":mini(%s, base_guard + int(bonuses.get("guard",0))),"distance":1,"states":[],' % os.environ['CAP']
          if s.count(old)!=1: raise SystemExit(f'guard anchor mismatch: {s.count(old)}')
          p.write_text(s.replace(old,new), encoding='utf-8')
          PY
            fi
            echo "=== 10.8 GUARD_CAP $label ==="
            output=$(/tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path projeto_jornada res://tests/forja_guard_cap_probe.tscn 2>&1)
            printf '%s\n' "$output" | grep '^10\.8 guardcap AGG'
            if printf '%s\n' "$output" | grep -E 'SCRIPT ERROR|Parse Error'; then
              printf '%s\n' "$output"
              exit 1
            fi
          }
          run_case current none
          run_case cap10 10
          run_case cap8 8
          run_case cap6 6
