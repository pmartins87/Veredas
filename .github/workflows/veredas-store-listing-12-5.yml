name: Veredas Store Listing 12.5

on:
  workflow_dispatch:
  push:
    branches:
      - projeto-jornada-snapshots
    paths:
      - 'projeto_jornada/RELEASE_12_5_STATE.json'
      - 'projeto_jornada/RELEASE_12_1_NAME_STATE.json'
      - 'projeto_jornada/QA_11_10_COMPLETION.json'
      - 'projeto_jornada/product/store_listing_google_play.json'
      - 'projeto_jornada/product/store_capture_manifest.json'
      - 'projeto_jornada/store/google_play/**'
      - 'projeto_jornada/tools/store_listing_gate.py'
      - 'projeto_jornada/tools/store_capture_provenance_gate.py'
      - 'projeto_jornada/tools/finalize_store_capture_manifest.py'
      - '.github/workflows/veredas-store-listing-12-5.yml'

permissions:
  contents: read

jobs:
  store-listing-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate store listing and screenshot provenance
        working-directory: projeto_jornada
        run: |
          python -m py_compile tools/store_listing_gate.py tools/store_capture_provenance_gate.py tools/finalize_store_capture_manifest.py
          python tools/store_listing_gate.py
          python tools/store_capture_provenance_gate.py
      - name: Preserve clean source tree
        run: git diff --exit-code
