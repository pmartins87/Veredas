name: Veredas 10.5 Narrative Audit
# Runtime frequency probe over the refined causal narrative graph.

on:
  push:
    branches:
      - projeto-jornada-snapshots
    paths:
      - '.github/workflows/veredas-105-narrative-audit.yml'
      - 'projeto_jornada/tools/audit_narrative_balance.py'
      - 'projeto_jornada/tools/refine_narrative_balance.py'
      - 'projeto_jornada/core/systems/EventDirector.gd'
      - 'projeto_jornada/core/systems/NarrativeDebtEngine.gd'
      - 'projeto_jornada/core/systems/ConditionEngine.gd'
      - 'projeto_jornada/tests/NarrativeBalanceProbe.gd'
      - 'projeto_jornada/tests/narrative_balance_probe.tscn'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild canonical content
        working-directory: projeto_jornada
        run: |
          python tools/rebuild_content.py
          python tools/refine_npc_authenticity.py
          python tools/refine_character_balance.py
          python tools/enforce_character_horizontal_budget.py
          python tools/refine_enemy_balance.py
          python tools/refine_item_economy.py
          python tools/refine_narrative_balance.py
      - name: Audit Phase 10.5 narrative balance schema
        working-directory: projeto_jornada
        run: python tools/audit_narrative_balance.py
      - name: Download Godot 4.7.1 stable
        run: |
          curl -fL 'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7.1' -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project headless
        run: |
          set -o pipefail
          output=$(/tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path projeto_jornada --editor --quit 2>&1)
          printf '%s\n' "$output"
          if printf '%s\n' "$output" | grep -E 'SCRIPT ERROR|Parse Error|Compile Error|Failed to load script'; then
            exit 1
          fi
      - name: Probe Phase 10.5 runtime frequencies
        run: |
          bash projeto_jornada/tools/run_godot_gate.sh \
            /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            res://tests/narrative_balance_probe.tscn \
            'NARRATIVE_BALANCE_PROBE FAIL' \
            'NARRATIVE_BALANCE_PROBE PASS'
