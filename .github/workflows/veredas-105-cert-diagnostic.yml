name: Veredas 10.5 Certification Diagnostic

on:
  push:
    branches:
      - projeto-jornada-snapshots
    paths:
      - '.github/workflows/veredas-105-cert-diagnostic.yml'
  workflow_dispatch:

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild canonical content
        working-directory: projeto_jornada
        run: |
          python tools/rebuild_content.py
          python tools/refine_npc_authenticity.py
          python tools/refine_character_balance.py
          python tools/enforce_character_horizontal_budget.py
          python tools/refine_enemy_balance.py
          python tools/refine_item_economy.py
          python tools/refine_narrative_balance.py
      - name: Download Godot
        run: |
          curl -fL 'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7.1' -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        run: |
          set -o pipefail
          output=$(/tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path projeto_jornada --editor --quit 2>&1)
          printf '%s\n' "$output"
          if printf '%s\n' "$output" | grep -E 'SCRIPT ERROR|Parse Error|Compile Error|Failed to load script'; then exit 1; fi
      - name: Run only permanent 10.5 gate
        run: |
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path projeto_jornada res://tests/narrative_balance_certification.tscn 2>&1 | tee /tmp/105.log
          code=${PIPESTATUS[0]}
          echo '--- 10.5 failure/pass lines ---'
          grep -E '10\.5 certification matrix|NARRATIVE_BALANCE_CERTIFICATION' /tmp/105.log || true
          exit $code
