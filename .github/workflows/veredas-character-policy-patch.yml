name: Veredas Character Balance Gate Fix

on:
  push:
    branches:
      - projeto-jornada-snapshots
    paths:
      - '.github/workflows/veredas-character-policy-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: projeto-jornada-snapshots
          fetch-depth: 0
      - name: Apply exact 10.2 typing fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('projeto_jornada/tests/CharacterBalanceCertification.gd')
          text = p.read_text(encoding='utf-8')
          old = '            var changed := result.get("actor", {}) != actor or result.get("target", {}) != target or result.get("resources", {}) != pool\n'
          new = '            var changed: bool = result.get("actor", {}) != actor or result.get("target", {}) != target or result.get("resources", {}) != pool\n'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one 10.2 typing target, found {count}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          git diff -- projeto_jornada/tests/CharacterBalanceCertification.gd
      - name: Commit fix
        run: |
          git config user.name 'Veredas CI'
          git config user.email 'actions@users.noreply.github.com'
          git add projeto_jornada/tests/CharacterBalanceCertification.gd
          git commit -m 'Fix Phase 10.2 gate Variant boolean typing'
          git push origin HEAD:projeto-jornada-snapshots
