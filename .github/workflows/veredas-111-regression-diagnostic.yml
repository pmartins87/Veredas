name: Veredas 11.1 Regression Diagnostic

on:
  push:
    branches:
      - projeto-jornada-snapshots
  workflow_dispatch:

concurrency:
  group: veredas-111-regression-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild integrated fixture
        working-directory: projeto_jornada
        run: |
          python tools/rebuild_content.py >/dev/null
          python tools/refine_npc_authenticity.py >/dev/null
          python tools/refine_character_balance.py >/dev/null
          python tools/enforce_character_horizontal_budget.py >/dev/null
          python tools/refine_enemy_balance.py >/dev/null
          python tools/refine_item_economy.py >/dev/null
          python tools/refine_narrative_balance.py >/dev/null
          python tools/validate_canonical.py >/dev/null
      - name: Download Godot
        run: |
          curl -fsSL 'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7.1' -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path projeto_jornada --editor --quit >/dev/null 2>&1
      - name: Capture focused 11.1 diagnostics
        run: |
          set +e
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path projeto_jornada res://tests/regression_matrix_certification.tscn > /tmp/regression-full.log 2>&1
          status=$?
          grep -E '^(11\.1|ERROR: REGRESSION_MATRIX_CERTIFICATION|REGRESSION_MATRIX_CERTIFICATION|SCRIPT ERROR|Parse Error|Failed to load script)' /tmp/regression-full.log > /tmp/regression-111.txt || true
          printf '%s\n' "$status" > /tmp/regression-status.txt
          cat /tmp/regression-111.txt
          exit 0
      - name: Upload focused diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: regression-111-diagnostics
          path: |
            /tmp/regression-111.txt
            /tmp/regression-status.txt
          if-no-files-found: error
          retention-days: 1
      - name: Enforce diagnostic result
        run: |
          status=$(cat /tmp/regression-status.txt)
          test "$status" -eq 0
