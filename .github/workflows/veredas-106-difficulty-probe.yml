name: Veredas 10.6 Difficulty Probe

on:
  push:
    branches:
      - projeto-jornada-snapshots
  workflow_dispatch:

concurrency:
  group: veredas-106-difficulty-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild integrated balance fixture
        working-directory: projeto_jornada
        run: |
          python tools/rebuild_content.py
          python tools/refine_npc_authenticity.py
          python tools/refine_character_balance.py
          python tools/enforce_character_horizontal_budget.py
          python tools/refine_enemy_balance.py
          python tools/refine_item_economy.py
          python tools/refine_narrative_balance.py
          python tools/validate_canonical.py

      - name: Download Godot 4.7.1 stable
        run: |
          curl -fL 'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7.1' -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64

      - name: Import project headless
        run: |
          set -o pipefail
          output=$(/tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path projeto_jornada --editor --quit 2>&1)
          printf '%s\n' "$output"
          if printf '%s\n' "$output" | grep -E 'SCRIPT ERROR|Parse Error|Failed to load script'; then
            exit 1
          fi

      - name: Run paired difficulty matrix
        run: |
          set -o pipefail
          output=$(/tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path projeto_jornada res://tests/difficulty_balance_probe.tscn 2>&1)
          printf '%s\n' "$output"
          if printf '%s\n' "$output" | grep -E 'SCRIPT ERROR|Parse Error|DIFFICULTY_BALANCE_PROBE FAIL'; then
            exit 1
          fi
          printf '%s\n' "$output" | grep -q 'DIFFICULTY_BALANCE_PROBE PASS: 10.6 instrumentation'
