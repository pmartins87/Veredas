name: Veredas Audiovisual Context 11.7

on:
  push:
    branches:
      - main
    paths:
      - 'projeto_jornada/audio/**'
      - 'projeto_jornada/project.godot'
      - 'projeto_jornada/tests/AudiovisualContextCertification.gd'
      - 'projeto_jornada/tests/audiovisual_context_certification.tscn'
      - 'projeto_jornada/tools/audit_audio_assets.py'
      - 'projeto_jornada/tools/validate_phase7_integration.py'
      - '.github/workflows/veredas-audiovisual-context.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audiovisual-context-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit 38-reference launch audio contract
        working-directory: projeto_jornada
        run: python tools/audit_audio_assets.py --output /tmp/veredas-audio-assets.json
      - name: Rebuild runtime content
        working-directory: projeto_jornada
        run: python tools/rebuild_content.py
      - name: Validate Phase 7 integration contract
        working-directory: projeto_jornada
        run: python tools/validate_phase7_integration.py
      - name: Download Godot 4.7.1 stable
        run: |
          curl -fL 'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7.1' -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import scripts headless
        run: |
          set -o pipefail
          output=$(/tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path projeto_jornada --editor --quit 2>&1)
          printf '%s\n' "$output"
          if printf '%s\n' "$output" | grep -E 'SCRIPT ERROR|Parse Error|Failed to load script'; then exit 1; fi
      - name: Exercise audiovisual routing
        run: |
          set -o pipefail
          output=$(/tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path projeto_jornada res://tests/audiovisual_context_certification.tscn 2>&1)
          printf '%s\n' "$output"
          if printf '%s\n' "$output" | grep -E 'SCRIPT ERROR|Parse Error|AUDIOVISUAL_CONTEXT_CERTIFICATION FAIL'; then exit 1; fi
          printf '%s\n' "$output" | grep -Eq 'AUDIOVISUAL_CONTEXT_(PREFLIGHT|CERTIFICATION) PASS'
      - name: Upload audiovisual preflight report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veredas-audiovisual-context-11-7
          path: /tmp/veredas-audio-assets.json
          if-no-files-found: ignore
          retention-days: 7
