name: Veredas 11.3 API29 Relaunch Memory Probe

on:
  push:
    branches:
      - projeto-jornada-snapshots
    paths:
      - '.github/workflows/veredas-113-api29-memory-probe.yml'
      - 'projeto_jornada/tools/android_api29_relaunch_probe.sh'

permissions:
  actions: read
  contents: read

env:
  PROBE_REPEAT: '2'

concurrency:
  group: veredas-113-api29-memory-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api29-relaunch-memory-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare emulator runtime and KVM
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse0
          sudo chmod 666 /dev/kvm
      - name: Download exact APK from 11.3-B source run
        uses: actions/download-artifact@v4
        with:
          name: veredas-debug-apk
          path: android-artifact
          repository: pmartins87/desktop-tutorial
          run-id: 31350079016
          github-token: ${{ github.token }}
      - name: Verify exact APK
        run: |
          test -s android-artifact/veredas-debug.apk
          sha256sum android-artifact/veredas-debug.apk | tee android-artifact/probe-apk.sha256
      - name: API 29 three-relaunch memory probe
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -no-metrics -gpu swiftshader_indirect
          script: sh projeto_jornada/tools/android_api29_relaunch_probe.sh com.veredasdatrama.preview android-artifact/veredas-debug.apk
      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veredas-api29-relaunch-memory-probe-repeat-${{ env.PROBE_REPEAT }}
          path: android-api29-relaunch-probe/
          if-no-files-found: warn
          retention-days: 2
