name: Veredas 11.6 UI Migration

on:
  push:
    branches:
      - projeto-jornada-snapshots
    paths:
      - 'projeto_jornada/tools/migrate_scene_ui_localization.py'
      - 'projeto_jornada/tools/localization_inventory.py'
      - 'projeto_jornada/tools/ui_localization_inventory.py'
      - '.github/workflows/veredas-116-ui-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: veredas-116-ui-migration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: projeto-jornada-snapshots
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Upgrade localization inventory contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('projeto_jornada/tools/localization_inventory.py')
          s = p.read_text(encoding='utf-8')
          old = '''    if len(required_keys) != 14 or len(set(required_keys)) != len(required_keys):\n        errors.append(f"expected 14 unique migrated UI keys, got {len(required_keys)}")\n'''
          new = '''    if len(required_keys) < 14 or len(set(required_keys)) != len(required_keys):\n        errors.append(f"expected at least 14 unique required UI keys, got {len(required_keys)}")\n'''
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('UI key-count contract anchor missing')
          old_print = '''        "LOCALIZATION_INVENTORY PASS: 11.5 records=5160 source_strings=%d launch_locales=3 ui_required=14 translated_required=%d overlay_entries=%d nested_overlays=%d"\n        % (len(source_strings), translated_required, overlay_entries, nested_overlay_entries)\n'''
          new_print = '''        "LOCALIZATION_INVENTORY PASS: 11.5 records=5160 source_strings=%d launch_locales=3 ui_required=%d translated_required=%d overlay_entries=%d nested_overlays=%d"\n        % (len(source_strings), len(required_keys), translated_required, overlay_entries, nested_overlay_entries)\n'''
          if old_print in s:
              s = s.replace(old_print, new_print, 1)
          elif new_print not in s:
              raise SystemExit('UI inventory PASS output anchor missing')
          p.write_text(s, encoding='utf-8')

          p = Path('projeto_jornada/tools/ui_localization_inventory.py')
          s = p.read_text(encoding='utf-8')
          anchor = '    "add_theme_constant_override(", ".name =", " name =", "call_deferred(",\n'
          replacement = '    "add_theme_constant_override(", ".name =", " name =", "call_deferred(", "_add_toggle(",\n'
          if anchor in s:
              s = s.replace(anchor, replacement, 1)
          elif replacement not in s:
              raise SystemExit('UI technical-node filter anchor missing')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Apply deterministic UI localization migration
        working-directory: projeto_jornada
        run: python tools/migrate_scene_ui_localization.py
      - name: Rebuild integrated fixture
        working-directory: projeto_jornada
        run: |
          python tools/rebuild_content.py >/dev/null
          python tools/refine_npc_authenticity.py >/dev/null
          python tools/refine_character_balance.py >/dev/null
          python tools/enforce_character_horizontal_budget.py >/dev/null
          python tools/refine_enemy_balance.py >/dev/null
          python tools/refine_item_economy.py >/dev/null
          python tools/refine_narrative_balance.py >/dev/null
          python tools/validate_canonical.py >/dev/null
      - name: Validate localization inventories
        working-directory: projeto_jornada
        run: |
          python tools/ui_localization_inventory.py --require-zero
          python tools/localization_inventory.py
          python tools/localization_schema_audit.py --require-classified
      - name: Download Godot
        run: |
          curl -fsSL 'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7.1' -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project headless
        run: |
          set -o pipefail
          output=$(/tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path projeto_jornada --editor --quit 2>&1)
          if printf '%s\n' "$output" | grep -E 'SCRIPT ERROR|Parse Error|Failed to load script'; then printf '%s\n' "$output"; exit 1; fi
      - name: Validate localization runtime
        run: |
          bash projeto_jornada/tools/run_godot_gate.sh \
            /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            res://tests/localization_architecture_certification.tscn \
            'LOCALIZATION_ARCHITECTURE_CERTIFICATION FAIL' \
            'LOCALIZATION_ARCHITECTURE_CERTIFICATION PASS: 11.5'
      - name: Validate responsive regression
        run: |
          bash projeto_jornada/tools/run_godot_gate.sh \
            /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            res://tests/responsive_accessibility_certification.tscn \
            'RESPONSIVE_ACCESSIBILITY_CERTIFICATION FAIL' \
            'RESPONSIVE_ACCESSIBILITY_CERTIFICATION PASS: 11.4'
      - name: Persist validated migration
        run: |
          git config user.name 'Veredas CI'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            projeto_jornada/scenes/JourneySetup.gd \
            projeto_jornada/scenes/VigilThreads.gd \
            projeto_jornada/scenes/Hub.gd \
            projeto_jornada/scenes/Main.gd \
            projeto_jornada/scenes/Codex.gd \
            projeto_jornada/localization/manifest.json \
            projeto_jornada/localization/ui/pt_BR.json \
            projeto_jornada/localization/ui/en.json \
            projeto_jornada/localization/ui/es_419.json \
            projeto_jornada/tools/localization_inventory.py \
            projeto_jornada/tools/ui_localization_inventory.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'UI localization migration already persisted.'
            exit 0
          fi
          git commit -m 'i18n: migrate primary scene UI into launch catalogs'
          git push origin HEAD:projeto-jornada-snapshots
