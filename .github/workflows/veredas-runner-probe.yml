name: Veredas Runner Allocation Probe

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/veredas-runner-probe.yml'
  workflow_dispatch:

permissions: {}

jobs:
  runner-allocation-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Prove hosted runner allocation
        shell: bash
        run: |
          set -euo pipefail
          echo "RUNNER_ALLOCATION_PROBE PASS"
          uname -a
