name: Veredas Maintenance — Exclude Non-Launch Localization Probe

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/veredas-maintenance-patch-localization-scope.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact launch-scope patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('projeto_jornada/tools/localization_quality_gate.py')
          text = path.read_text(encoding='utf-8')
          old = (
              '    source_units = {\n'
              '        str(row["key"]): str(row["source"])\n'
              '        for row in catalog.get("units", [])\n'
              '        if isinstance(row, dict) and isinstance(row.get("key"), str) and isinstance(row.get("source"), str)\n'
              '    }\n'
          )
          new = (
              '    non_launch_probe_keys = {"ui.architecture.source_only_probe"}\n'
              '    source_units = {\n'
              '        str(row["key"]): str(row["source"])\n'
              '        for row in catalog.get("units", [])\n'
              '        if isinstance(row, dict)\n'
              '        and isinstance(row.get("key"), str)\n'
              '        and isinstance(row.get("source"), str)\n'
              '        and str(row["key"]) not in non_launch_probe_keys\n'
              '    }\n'
          )
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one source-unit scope block, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python -m py_compile projeto_jornada/tools/localization_quality_gate.py
          git diff --check
      - name: Persist localization launch-scope correction
        run: |
          git config user.name 'Veredas CI'
          git config user.email 'actions@users.noreply.github.com'
          git add projeto_jornada/tools/localization_quality_gate.py
          git diff --cached --check
          git commit -m 'i18n: exclude architecture fallback probe from launch coverage'
          git push origin HEAD:main
