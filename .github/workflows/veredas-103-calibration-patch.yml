name: Veredas 10.3 Calibration Patch

on:
  push:
    branches:
      - projeto-jornada-snapshots
    paths:
      - '.github/workflows/veredas-103-calibration-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: projeto-jornada-snapshots
          fetch-depth: 0
      - name: Narrow balanced policy without weakening gates
        run: |
          python - <<'PY'
          from pathlib import Path

          policy = Path('projeto_jornada/core/systems/PlayerPolicyEngine.gd')
          text = policy.read_text(encoding='utf-8')
          replacements = [
              (
                  '    var progress_ability := _best_ability(payable, ["damage", "echo", "range", "debt", "counter", "posture"])\n',
                  '    var progress_ability := _best_ability(payable, ["damage", "range", "debt", "posture", "echo"])\n'
              ),
              (
                  '        if hp_ratio <= 0.52 and not healing_ability.is_empty():\n',
                  '        if hp_ratio <= 0.45 and not healing_ability.is_empty():\n'
              ),
              (
                  '        if _resource_is_worthwhile(resource_ability, character_id, resource_pool, incoming_risky):\n            return {"kind":"ability", "id":str(resource_ability.get("id", ""))}\n        if int(player.get("vigor", 0)) >= 3:\n',
                  '        if int(player.get("vigor", 0)) >= 3:\n'
              ),
              (
                  '    if _setup_is_worthwhile(setup_ability, enemy, enemy_hp_ratio):\n        return {"kind":"ability", "id":str(setup_ability.get("id", ""))}\n    if not progress_ability.is_empty():\n        return {"kind":"ability", "id":str(progress_ability.get("id", ""))}\n    if _resource_is_worthwhile(resource_ability, character_id, resource_pool, incoming_risky):\n        return {"kind":"ability", "id":str(resource_ability.get("id", ""))}\n    if int(player.get("vigor", 0)) >= 3:\n',
                  '    if not progress_ability.is_empty():\n        return {"kind":"ability", "id":str(progress_ability.get("id", ""))}\n    if int(player.get("vigor", 0)) >= 3:\n'
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Policy patch target count {count} for: {old[:100]!r}')
              text = text.replace(old, new, 1)
          policy.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git diff -- projeto_jornada/core/systems/PlayerPolicyEngine.gd
      - name: Commit focused policy correction
        run: |
          git config user.name 'Veredas CI'
          git config user.email 'actions@users.noreply.github.com'
          git add projeto_jornada/core/systems/PlayerPolicyEngine.gd
          git commit -m 'Keep balanced combat decisive under 10.3'
          git push origin HEAD:projeto-jornada-snapshots
