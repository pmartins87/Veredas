name: Veredas 10.3 Calibration Patch

on:
  push:
    branches:
      - projeto-jornada-snapshots
    paths:
      - '.github/workflows/veredas-103-calibration-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: projeto-jornada-snapshots
          fetch-depth: 0
      - name: Refine final policy behavior without changing gates
        run: |
          python - <<'PY'
          from pathlib import Path
          policy = Path('projeto_jornada/core/systems/PlayerPolicyEngine.gd')
          text = policy.read_text(encoding='utf-8')
          replacements = [
              ('    var balanced_progress_ability := _best_ability(payable, ["damage", "range", "debt", "posture"])\n',
               '    var balanced_progress_ability := _best_ability(payable, ["damage", "debt", "posture", "range"])\n'),
              ('        if _resource_is_worthwhile(resource_ability, character_id, resource_pool, incoming_risky):\n            return {"kind":"ability", "id":str(resource_ability.get("id", ""))}\n        if not utility_ability.is_empty() and not movement_locked:\n',
               '        if not utility_ability.is_empty() and not movement_locked:\n'),
              ('    if incoming_risky and guard_value < 2 and hp_ratio <= 0.45:\n',
               '    if incoming_risky and guard_value < 2 and hp_ratio <= 0.50:\n'),
              ('    if hp_ratio <= 0.15 and not healing_ability.is_empty():\n',
               '    if hp_ratio <= 0.15 and enemy_hp_ratio <= 0.45 and not healing_ability.is_empty():\n'),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'policy target count={count}: {old[:90]!r}')
              text = text.replace(old, new, 1)
          policy.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git diff -- projeto_jornada/core/systems/PlayerPolicyEngine.gd
      - name: Commit final policy refinement
        run: |
          git config user.name 'Veredas CI'
          git config user.email 'actions@users.noreply.github.com'
          git add projeto_jornada/core/systems/PlayerPolicyEngine.gd
          git commit -m 'Refine final 10.2 policy behavior'
          git push origin HEAD:projeto-jornada-snapshots
