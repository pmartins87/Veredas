name: Veredas 10.3 Calibration Patch

on:
  push:
    branches:
      - projeto-jornada-snapshots
    paths:
      - '.github/workflows/veredas-103-calibration-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: projeto-jornada-snapshots
          fetch-depth: 0
      - name: Apply targeted final character tuning without changing gates
        run: |
          python - <<'PY'
          from pathlib import Path

          balance = Path('projeto_jornada/tools/refine_character_balance.py')
          text = balance.read_text(encoding='utf-8')
          policy_replacements = [
              ('"Cantora de Cipós": ("status", "resource", "explorer", "expert", "controller", "rooted"),',
               '"Cantora de Cipós": ("status", "resource", "balanced", "expert", "controller", "rooted"),'),
              ('"Contrabandista de Portas": ("move", "debt", "explorer", "intermediate", "raider", "fear"),',
               '"Contrabandista de Portas": ("move", "debt", "balanced", "intermediate", "raider", "fear"),'),
              ('"Arquivista": ("mark", "resource", "explorer", "intermediate", "scholar", "fear"),',
               '"Arquivista": ("mark", "resource", "balanced", "intermediate", "scholar", "fear"),'),
          ]
          for old, new in policy_replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'learning-policy target mismatch: {old}')
              text = text.replace(old, new, 1)
          balance.write_text(text, encoding='utf-8')

          budget = Path('projeto_jornada/tools/enforce_character_horizontal_budget.py')
          text = budget.read_text(encoding='utf-8')
          old = '''    "Peregrina da Sede": {
        "heal": {"power": 4, "cost": 3},
        "resource": {"power": 2, "cost": 0},
    },
}'''
          new = '''    "Peregrina da Sede": {
        "heal": {"power": 4, "cost": 3},
        "resource": {"power": 2, "cost": 0},
    },
    "Barqueiro do Reflexo": {
        "counter": {"power": 4, "cost": 3},
    },
    "Magistrada do Limiar": {
        "guard": {"power": 4, "cost": 2},
    },
    "Portador da Brasa": {
        "damage": {"power": 4, "cost": 1},
    },
}'''
          if text.count(old) != 1:
              raise SystemExit('targeted tuning insertion mismatch')
          text = text.replace(old, new, 1)
          old = '    print("CHARACTER_TARGETED_TUNING PASS: Vigia de Maré and Peregrina da Sede")\n'
          new = '    print("CHARACTER_TARGETED_TUNING PASS: %s" % ", ".join(sorted(tuned)))\n'
          if text.count(old) != 1:
              raise SystemExit('targeted tuning print mismatch')
          text = text.replace(old, new, 1)
          budget.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git diff -- projeto_jornada/tools/refine_character_balance.py projeto_jornada/tools/enforce_character_horizontal_budget.py
      - name: Commit targeted final tuning
        run: |
          git config user.name 'Veredas CI'
          git config user.email 'actions@users.noreply.github.com'
          git add projeto_jornada/tools/refine_character_balance.py projeto_jornada/tools/enforce_character_horizontal_budget.py
          git commit -m 'Tune final 10.2 character outliers'
          git push origin HEAD:projeto-jornada-snapshots
