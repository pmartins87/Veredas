name: Veredas 10.3 Calibration Patch

on:
  push:
    branches:
      - projeto-jornada-snapshots
    paths:
      - '.github/workflows/veredas-103-calibration-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: projeto-jornada-snapshots
          fetch-depth: 0
      - name: Remove redundant in-range explorer mobility without changing gates
        run: |
          python -c "from pathlib import Path; p=Path('projeto_jornada/core/systems/PlayerPolicyEngine.gd'); s=p.read_text(encoding='utf-8'); old='        if not utility_ability.is_empty() and not movement_locked:\n            return {\"kind\":\"ability\", \"id\":str(utility_ability.get(\"id\", \"\"))}\n        if int(player.get(\"vigor\", 0)) >= 3:\n'; new='        if int(player.get(\"vigor\", 0)) >= 3:\n'; (s.count(old)==1) or (_ for _ in ()).throw(SystemExit('explorer mobility target mismatch')); p.write_text(s.replace(old,new,1),encoding='utf-8')"
          git diff --check
          git diff -- projeto_jornada/core/systems/PlayerPolicyEngine.gd
      - name: Commit final policy cleanup
        run: |
          git config user.name 'Veredas CI'
          git config user.email 'actions@users.noreply.github.com'
          git add projeto_jornada/core/systems/PlayerPolicyEngine.gd
          git commit -m 'Avoid redundant explorer mobility in range'
          git push origin HEAD:projeto-jornada-snapshots
