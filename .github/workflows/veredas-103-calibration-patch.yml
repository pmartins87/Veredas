name: Veredas 10.3 Calibration Patch

on:
  push:
    branches:
      - projeto-jornada-snapshots
    paths:
      - '.github/workflows/veredas-103-calibration-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: projeto-jornada-snapshots
          fetch-depth: 0
      - name: Correct Oraculo recommended policy from certification evidence
        run: |
          python -c "from pathlib import Path; p=Path('projeto_jornada/tools/refine_character_balance.py'); s=p.read_text(encoding='utf-8'); old='\"Oráculo do Meio-Dia\": (\"mark\", \"echo\", \"explorer\", \"expert\", \"seer\", \"burning\"),'; new='\"Oráculo do Meio-Dia\": (\"mark\", \"echo\", \"balanced\", \"expert\", \"seer\", \"burning\"),'; (s.count(old)==1) or (_ for _ in ()).throw(SystemExit('Oraculo policy target mismatch')); p.write_text(s.replace(old,new,1),encoding='utf-8')"
          git diff --check
          git diff -- projeto_jornada/tools/refine_character_balance.py
      - name: Commit Oraculo policy correction
        run: |
          git config user.name 'Veredas CI'
          git config user.email 'actions@users.noreply.github.com'
          git add projeto_jornada/tools/refine_character_balance.py
          git commit -m 'Use balanced mastery policy for Oraculo'
          git push origin HEAD:projeto-jornada-snapshots
