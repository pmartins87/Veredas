name: Veredas Surgical Parser Fix

on:
  push:
    branches:
      - projeto-jornada-snapshots
    paths:
      - '.github/workflows/veredas-surgical-parser-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: projeto-jornada-snapshots
          fetch-depth: 0
      - name: Apply exact parser fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('projeto_jornada/core/systems/JourneySimulationEngine.gd')
          text = path.read_text(encoding='utf-8')
          needle = '            str(result.get("ending_id", "")),\n        ]))\n    return "\\n".join(rows).sha256_text()'
          replacement = '            str(result.get("ending_id", "")),\n        ])\n    return "\\n".join(rows).sha256_text()'
          count = text.count(needle)
          if count != 1:
              raise SystemExit(f'Expected exactly one parser-fix target, found {count}')
          path.write_text(text.replace(needle, replacement, 1), encoding='utf-8')
          PY
          git diff --check
          git diff -- projeto_jornada/core/systems/JourneySimulationEngine.gd
      - name: Commit fix
        run: |
          git config user.name 'Veredas CI'
          git config user.email 'actions@users.noreply.github.com'
          git add projeto_jornada/core/systems/JourneySimulationEngine.gd
          git commit -m 'Fix JourneySimulationEngine result signature parser error'
          git push origin HEAD:projeto-jornada-snapshots
