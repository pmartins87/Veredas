name: Veredas Physical Soak Kit

on:
  push:
    branches:
      - main
    paths:
      - 'projeto_jornada/tools/android_physical_soak_windows.ps1'
      - 'projeto_jornada/tools/INICIAR_TESTE_11_3.bat'
      - '.github/workflows/veredas-physical-soak-kit.yml'
  workflow_dispatch:

concurrency:
  group: veredas-physical-soak-kit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-kit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download exact certified candidate APK
        uses: actions/download-artifact@v4
        with:
          name: veredas-debug-apk
          path: kit
          github-token: ${{ github.token }}
          run-id: 31856094548

      - name: Verify candidate APK and Windows files
        shell: bash
        run: |
          set -euo pipefail
          expected='d01119c949ecd72b20f1af9b56dac8a359452ae71503612f4e898a173c5ff879'
          actual="$(sha256sum kit/veredas-debug.apk | awk '{print $1}')"
          test "$actual" = "$expected"
          python - <<'PY'
          from pathlib import Path
          collector = Path('projeto_jornada/tools/android_physical_soak_windows.ps1')
          launcher = Path('projeto_jornada/tools/INICIAR_TESTE_11_3.bat')
          for path in (collector, launcher):
              data = path.read_bytes()
              assert data and all(b < 128 for b in data), f'{path} must remain ASCII-only'
          text = collector.read_text(encoding='ascii')
          assert '$Args' not in text, 'PowerShell automatic variable $Args must not be used by collector helpers'
          assert 'function AdbText([string[]]$AdbArgs)' in text
          assert '& adb @AdbArgs' in text
          PY
          cp projeto_jornada/tools/android_physical_soak_windows.ps1 kit/android_physical_soak_windows.ps1
          cp projeto_jornada/tools/INICIAR_TESTE_11_3.bat kit/INICIAR_TESTE_11_3.bat

      - name: Write instructions
        shell: bash
        run: |
          cat > kit/LEIA_ME.txt <<'TXT'
          VEREDAS DA TRAMA - TESTE FISICO ANDROID 11.3 - KIT V4

          1. Deixe a Depuracao USB ativa e o aparelho autorizado no ADB.
          2. Confirme antes, se quiser: adb devices
          3. Execute INICIAR_TESTE_11_3.bat.
          4. O launcher, o parser PowerShell 5.1 e o encaminhamento real de argumentos ADB foram validados em Windows no CI.
          5. O launcher faz uma nova validacao local do parser antes de iniciar.
          6. Aguarde as medicoes automaticas iniciais.
          7. Quando aparecer PLAY NORMALLY NOW, jogue normalmente por 30 minutos.
          8. Mantenha USB conectado e a janela aberta.
          9. No final, responda as quatro perguntas conforme o que realmente ocorreu.
          10. Envie ao ChatGPT:
              - veredas-physical-soak-11-3\physical_device_evidence.json
              - veredas-physical-soak-11-3\veredas-physical-soak-raw.zip

          APK SHA-256 esperado:
          d01119c949ecd72b20f1af9b56dac8a359452ae71503612f4e898a173c5ff879
          TXT

      - name: Verify kit integrity
        shell: bash
        run: |
          set -euo pipefail
          test -s kit/veredas-debug.apk
          test -s kit/android_physical_soak_windows.ps1
          test -s kit/INICIAR_TESTE_11_3.bat
          test -s kit/LEIA_ME.txt
          test "$(sha256sum kit/veredas-debug.apk | awk '{print $1}')" = 'd01119c949ecd72b20f1af9b56dac8a359452ae71503612f4e898a173c5ff879'

      - name: Upload validated physical soak kit
        uses: actions/upload-artifact@v4
        with:
          name: Veredas-11-3-Soak-Fisico-Windows-v4
          path: kit/*
          if-no-files-found: error
          retention-days: 14
