name: Veredas Reliability Soak 11.9

on:
  push:
    branches:
      - main
    paths:
      - 'projeto_jornada/core/**'
      - 'projeto_jornada/mobile/**'
      - 'projeto_jornada/tests/ReliabilitySoakCertification.gd'
      - 'projeto_jornada/tests/reliability_soak_certification.tscn'
      - 'projeto_jornada/tests/MobileCertification.gd'
      - 'projeto_jornada/tests/SaveFuzzCertification.gd'
      - 'projeto_jornada/tests/RunStateIntegrityCertification.gd'
      - 'projeto_jornada/tools/run_godot_gate.sh'
      - '.github/workflows/veredas-reliability-soak.yml'
  workflow_dispatch:

concurrency:
  group: veredas-reliability-soak-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  reliability-soak-11-9:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild integrated canonical fixture
        working-directory: projeto_jornada
        run: |
          python tools/rebuild_content.py >/dev/null
          python tools/refine_npc_authenticity.py >/dev/null
          python tools/refine_character_balance.py >/dev/null
          python tools/enforce_character_horizontal_budget.py >/dev/null
          python tools/refine_enemy_balance.py >/dev/null
          python tools/refine_item_economy.py >/dev/null
          python tools/refine_narrative_balance.py >/dev/null
          python tools/validate_canonical.py >/dev/null
      - name: Download Godot
        run: |
          curl -fsSL 'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7.1' -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project headless
        run: |
          set -o pipefail
          output=$(/tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path projeto_jornada --editor --quit 2>&1)
          if printf '%s\n' "$output" | grep -E 'SCRIPT ERROR|Parse Error|Failed to load script'; then
            printf '%s\n' "$output"
            exit 1
          fi
      - name: Preserve mobile lifecycle baseline 8.2
        run: |
          bash projeto_jornada/tools/run_godot_gate.sh \
            /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            res://tests/mobile_certification.tscn \
            'MOBILE_CERTIFICATION FAIL' \
            'MOBILE_CERTIFICATION PASS: 8.1 8.2 8.3 8.4'
      - name: Preserve save fuzz baseline 11.2
        run: |
          bash projeto_jornada/tools/run_godot_gate.sh \
            /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            res://tests/save_fuzz_certification.tscn \
            'SAVE_FUZZ_CERTIFICATION FAIL' \
            'SAVE_FUZZ_CERTIFICATION PASS: 11.2'
      - name: Preserve strict run-state baseline 11.2
        run: |
          bash projeto_jornada/tools/run_godot_gate.sh \
            /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            res://tests/run_state_integrity_certification.tscn \
            'RUN_STATE_INTEGRITY_CERTIFICATION FAIL' \
            'RUN_STATE_INTEGRITY_CERTIFICATION PASS: 11.2'
      - name: Phase 11 reliability soak certification 11.9
        run: |
          bash projeto_jornada/tools/run_godot_gate.sh \
            /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            res://tests/reliability_soak_certification.tscn \
            'RELIABILITY_SOAK_CERTIFICATION FAIL' \
            'RELIABILITY_SOAK_CERTIFICATION PASS: 11.9'
