name: Veredas Enemy Balance 10.3
# Definitive Phase 10.3 gate: always re-certify 10.2 before accepting enemy balance.
# Certification trigger after correcting the Oraculo recommended mastery policy.

on:
  push:
    branches:
      - projeto-jornada-snapshots
    paths:
      - 'projeto_jornada/tools/refine_enemy_balance.py'
      - 'projeto_jornada/tools/refine_item_economy.py'
      - 'projeto_jornada/core/systems/EnemyBalanceEngine.gd'
      - 'projeto_jornada/core/systems/CombatEngine.gd'
      - 'projeto_jornada/core/systems/BossPhaseEngine.gd'
      - 'projeto_jornada/core/systems/PlayerPolicyEngine.gd'
      - 'projeto_jornada/core/systems/JourneySimulationEngine.gd'
      - 'projeto_jornada/core/systems/ItemEconomyEngine.gd'
      - 'projeto_jornada/tests/EnemyBalanceCertification.gd'
      - 'projeto_jornada/tests/enemy_balance_certification.tscn'
      - '.github/workflows/veredas-enemy-balance.yml'
  workflow_dispatch:

jobs:
  enemy-balance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild canonical content with Phase 10 refiners
        working-directory: projeto_jornada
        run: |
          python tools/rebuild_content.py
          python tools/refine_npc_authenticity.py
          python tools/refine_character_balance.py
          python tools/enforce_character_horizontal_budget.py
          python tools/refine_enemy_balance.py
          python tools/refine_item_economy.py
          python tools/validate_canonical.py

      - name: Download Godot 4.7.1 stable
        run: |
          curl -fL 'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7.1' -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64

      - name: Import project headless
        run: |
          set -o pipefail
          timeout 90s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path projeto_jornada --editor --quit 2>&1 | tee /tmp/enemy-import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error|Failed to load script' /tmp/enemy-import.log; then
            echo 'Godot import emitted a script/parser/compile error.'
            exit 1
          fi

      - name: Re-certify Phase 10.2 under enemy rebalance
        run: |
          bash projeto_jornada/tools/run_godot_gate.sh \
            /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            res://tests/character_balance_certification.tscn \
            'CHARACTER_BALANCE_CERTIFICATION FAIL' \
            'CHARACTER_BALANCE_CERTIFICATION PASS: 10.2'

      - name: Certify Phase 10.3 enemy balance
        if: ${{ always() }}
        run: |
          bash projeto_jornada/tools/run_godot_gate.sh \
            /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            res://tests/enemy_balance_certification.tscn \
            'ENEMY_BALANCE_CERTIFICATION FAIL' \
            'ENEMY_BALANCE_CERTIFICATION PASS: 10.3'
